name: CI Native

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths: ['native/**', '.github/workflows/ci-native.yml']
  pull_request:
    branches: [master]
    # no `paths:` on purpose: the `changes` job below decides, so the `gate` job always reports
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Required-check plumbing. This workflow runs on every pull request (the pull_request trigger has no
  # workflow-level `paths:`) so that its `gate` job always reports: GitHub leaves the checks of a path-filtered
  # workflow that did not run "Pending" forever, which would block every unrelated PR once the gate is a
  # required status check. The path decision therefore lives here, at job level, where a skipped job counts
  # as success. Keep the pattern below in step with `push.paths` above.
  changes:
    name: "native: changes"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout (a pull request checks out its merge commit; depth 2 brings both parents)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Decide whether the paths of this workflow changed
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PATTERN: '^(native/|\.github/workflows/ci-native\.yml$)'
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "native: $EVENT event, run=true" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Fail closed: the diff below is only the pull request's own change set when HEAD is the merge commit.
          if ! git rev-parse --verify --quiet "HEAD^2" > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "native: HEAD is not a merge commit, run=true" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # -z: NUL-separated raw names (no quoting of non-ASCII paths). A file rather than a pipe, so that
          # grep -q closing early cannot turn a match into a SIGPIPE failure under pipefail.
          git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed.z"
          if grep -zEq "$PATTERN" "$RUNNER_TEMP/changed.z"; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          {
            echo "### native: changes -> run=$run"
            echo '```'
            tr '\0' '\n' < "$RUNNER_TEMP/changed.z"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  native-build-test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # Safety cap: a hung job shouldn't silently burn the private-repo 2000
    # min/month Actions budget. A clean run is ~10-12 minutes (apt 0.5 + build 7-8 + test 3); 30 is
    # headroom, not a target. 20 was not enough: on 2026-10-26/27 the runner's apt step took 9-12 minutes
    # and the two master pushes (99d8cb4, f7b964c) were cancelled at the cap mid-test, which turned
    # `native: gate` red although nothing was wrong with the code (owner approved the raise, 2026-10-27).
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Minutes optimization #1: libboost-all-dev pulls in every Boost
      # component (thread, filesystem, regex, python bindings, ...) when this
      # codebase only needs Boost.System (compiled) plus Boost.Asio/Beast
      # (header-only, covered by libboost-dev). Installing only what's used
      # cuts apt install time noticeably on every single run.
      - name: Install build tools (targeted Boost components only)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake libboost-dev libboost-system-dev libssl-dev

      # Minutes optimization #2: without this, every run does a fresh
      # FetchContent clone + full from-source build of GoogleTest (v1.15.2)
      # and simdjson (v3.12.3) before a single line of this repo's own code
      # compiles. Caching native/build (the whole CMake build tree, not just
      # _deps) also gives incremental rebuilds of unchanged project files
      # across runs, not just dependency reuse.
      - name: Cache CMake build tree (FetchContent deps + incremental objects)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/build
          key: native-build-${{ runner.os }}-gcc14-${{ hashFiles('native/CMakeLists.txt') }}
          restore-keys: |
            native-build-${{ runner.os }}-gcc14-

      - name: Configure (C++20, Release, with demo)
        working-directory: native
        run: cmake -B build -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release -DHY_BUILD_DEMO=ON

      - name: Build
        working-directory: native
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: native/build
        run: ctest --output-on-failure

  # MSVC on Windows (REM-0.1, audit P2-005/P2-008/P2-009): the only job that builds with the compiler the owner
  # develops with and that runs the Windows-only tests (test_windows_native_io, the lease layer's junction test).
  # NOT part of `gate` yet: it is reported on its own, and making it a required check is the owner's ruleset call
  # (docs/REQUIRED_CHECKS_RUNBOOK.md). The repository is public, so standard runner minutes are not billed; the
  # 2000 min/month note above predates that.
  windows-msvc:
    name: "native: windows-msvc"
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # OpenSSL and the Boost headers come from the runner's own vcpkg, in the same static-md triplet the
      # owner's local MSVC build uses (static libraries, dynamic CRT). Header-only Boost: the project defines
      # its own Boost::system target. The versions are whatever the runner image's vcpkg baseline gives.
      - name: Cache vcpkg installed tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed
          key: native-vcpkg-${{ runner.os }}-static-md-openssl-boost-beast-v1

      - name: Install OpenSSL and Boost headers (vcpkg, x64-windows-static-md)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static-md boost-asio:x64-windows-static-md boost-beast:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }
          Test-Path "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md\include\boost\beast.hpp" | ForEach-Object { if (-not $_) { throw "boost/beast.hpp not found after vcpkg install" } }

      - name: Show the toolchain
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property displayName
          & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationVersion

      - name: Configure (MSVC, Release, with demo)
        shell: pwsh
        run: |
          $v = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" -replace '\\', '/'
          cmake -S native -B native/build -A x64 -DCMAKE_BUILD_TYPE=Release -DHY_BUILD_DEMO=ON "-DBoost_INCLUDE_DIR=$v/include" "-DOPENSSL_ROOT_DIR=$v" "-DCMAKE_PREFIX_PATH=$v"
          if ($LASTEXITCODE -ne 0) { throw "configure failed ($LASTEXITCODE)" }

      - name: Build (/W4 /WX /permissive-)
        shell: pwsh
        run: |
          cmake --build native/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }

      - name: Test
        shell: pwsh
        working-directory: native/build
        run: |
          ctest -C Release --output-on-failure -j4
          if ($LASTEXITCODE -ne 0) { throw "ctest failed ($LASTEXITCODE)" }

      # gtest reports a test that called GTEST_SKIP() as "Passed" to ctest, so a runner that cannot create a
      # directory junction would turn the reparse-point tests into silent passes. Run them directly and refuse
      # any skip.
      - name: The junction tests ran and were not skipped
        shell: pwsh
        working-directory: native/build/Release
        run: |
          $runs = @(
            @('test_windows_native_io.exe', 'OpenDirectory.RejectsDirectoryJunction'),
            @('test_compaction_lease.exe', 'CandidateLease.AcquireRejectsALinkedCandidateDirectoryAndTouchesNothingBehindIt')
          )
          foreach ($r in $runs) {
            $out = & ".\$($r[0])" "--gtest_filter=$($r[1])" 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) { throw "$($r[1]) failed" }
            if ($out -match 'SKIPPED') { throw "$($r[1]) was skipped: a junction could not be created on this runner" }
            if ($out -notmatch '\[  PASSED  \] 1 test') { throw "$($r[1]) did not pass exactly once" }
          }

  # Always runs and is the only check of this workflow meant to be a required status check: it passes only if
  # the path decision succeeded and every guarded job ended exactly as that decision calls for (success when
  # run=true, skipped when run=false). Any other combination, including a failed or cancelled `changes` job,
  # fails it.
  gate:
    name: "native: gate"
    needs: [changes, native-build-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exactly the outcome the path decision calls for
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          NATIVE_BUILD_TEST: ${{ needs.native-build-test.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$CHANGES" = "success" ] || fail "the changes job ended as '$CHANGES', not 'success'"
          case "$RUN" in
            true)  want=success ;;
            false) want=skipped ;;
            *)     fail "the changes job gave no run decision ('$RUN')" ;;
          esac
          for pair in "native-build-test=$NATIVE_BUILD_TEST"; do
            name="${pair%%=*}"; got="${pair#*=}"
            [ "$got" = "$want" ] || fail "$name ended as '$got', expected '$want' (run=$RUN)"
          done
          echo "gate ok: run=$RUN, every guarded job is '$want'"

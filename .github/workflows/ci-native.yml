name: CI Native

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths: ['native/**', '.github/workflows/ci-native.yml']
  pull_request:
    branches: [master]
    # no `paths:` on purpose: the `changes` job below decides, so the `gate` job always reports
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Required-check plumbing. This workflow runs on every pull request (the pull_request trigger has no
  # workflow-level `paths:`) so that its `gate` job always reports: GitHub leaves the checks of a path-filtered
  # workflow that did not run "Pending" forever, which would block every unrelated PR once the gate is a
  # required status check. The path decision therefore lives here, at job level, where a skipped job counts
  # as success. Keep the pattern below in step with `push.paths` above.
  changes:
    name: "native: changes"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout (a pull request checks out its merge commit; depth 2 brings both parents)
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide whether the paths of this workflow changed
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PATTERN: '^(native/|\.github/workflows/ci-native\.yml$)'
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "native: $EVENT event, run=true" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Fail closed: the diff below is only the pull request's own change set when HEAD is the merge commit.
          if ! git rev-parse --verify --quiet "HEAD^2" > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "native: HEAD is not a merge commit, run=true" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # -z: NUL-separated raw names (no quoting of non-ASCII paths). A file rather than a pipe, so that
          # grep -q closing early cannot turn a match into a SIGPIPE failure under pipefail.
          git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed.z"
          if grep -zEq "$PATTERN" "$RUNNER_TEMP/changed.z"; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          {
            echo "### native: changes -> run=$run"
            echo '```'
            tr '\0' '\n' < "$RUNNER_TEMP/changed.z"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  native-build-test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # Safety cap: a hung job shouldn't silently burn the private-repo 2000
    # min/month Actions budget. A clean run is a few minutes; 20 is generous
    # headroom, not a target.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Minutes optimization #1: libboost-all-dev pulls in every Boost
      # component (thread, filesystem, regex, python bindings, ...) when this
      # codebase only needs Boost.System (compiled) plus Boost.Asio/Beast
      # (header-only, covered by libboost-dev). Installing only what's used
      # cuts apt install time noticeably on every single run.
      - name: Install build tools (targeted Boost components only)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake libboost-dev libboost-system-dev libssl-dev

      # Minutes optimization #2: without this, every run does a fresh
      # FetchContent clone + full from-source build of GoogleTest (v1.15.2)
      # and simdjson (v3.12.3) before a single line of this repo's own code
      # compiles. Caching native/build (the whole CMake build tree, not just
      # _deps) also gives incremental rebuilds of unchanged project files
      # across runs, not just dependency reuse.
      - name: Cache CMake build tree (FetchContent deps + incremental objects)
        uses: actions/cache@v6
        with:
          path: native/build
          key: native-build-${{ runner.os }}-gcc14-${{ hashFiles('native/CMakeLists.txt') }}
          restore-keys: |
            native-build-${{ runner.os }}-gcc14-

      - name: Configure (C++20, Release, with demo)
        working-directory: native
        run: cmake -B build -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release -DHY_BUILD_DEMO=ON

      - name: Build
        working-directory: native
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: native/build
        run: ctest --output-on-failure

  # Always runs and is the only check of this workflow meant to be a required status check: it passes only if
  # the path decision succeeded and every guarded job ended exactly as that decision calls for (success when
  # run=true, skipped when run=false). Any other combination, including a failed or cancelled `changes` job,
  # fails it.
  gate:
    name: "native: gate"
    needs: [changes, native-build-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exactly the outcome the path decision calls for
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          NATIVE_BUILD_TEST: ${{ needs.native-build-test.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$CHANGES" = "success" ] || fail "the changes job ended as '$CHANGES', not 'success'"
          case "$RUN" in
            true)  want=success ;;
            false) want=skipped ;;
            *)     fail "the changes job gave no run decision ('$RUN')" ;;
          esac
          for pair in "native-build-test=$NATIVE_BUILD_TEST"; do
            name="${pair%%=*}"; got="${pair#*=}"
            [ "$got" = "$want" ] || fail "$name ended as '$got', expected '$want' (run=$RUN)"
          done
          echo "gate ok: run=$RUN, every guarded job is '$want'"

name: CI Spec Verification

# Mechanized enforcement for Layers 1 and 3 of docs/SPEC_INVARIANTS.md.
#
# Why this workflow exists: ci-native.yml is path-filtered to 'native/**', so
# changes to docs/, tools/, or formal/ triggered NO checks at all. That made the
# invariant ledger and the TLA+ model manual-only mechanisms — exactly the kind
# that rot silently. It also interacts with main-merge-guard.yml, which treats a
# null statusCheckRollup ("no workflow matched the changed paths") as a pass: a
# docs-only or formal-only PR previously merged with zero verification.
#
# Deliberately does NOT touch ci-native.yml — the two are independent and a
# failure in one must not mask or block the other.
#
# Minutes optimization (2026-08-15): the 7 independent TLA+ models used to each
# run in their own job (7 separate ubuntu-24.04 runners), each paying its own
# checkout + setup-java + tla2tools.jar cache-restore overhead before running
# what's often just a few seconds of real TLC work. GitHub Actions bills a
# private repo's jobs in whole-minute increments rounded UP, so 7 jobs each
# under a minute of real work still billed 7 separate ~1-minute floors on every
# single triggering push/PR, against this repo's 2000-min/month budget. All 7
# models share the identical toolchain (JDK 21 + the same tla2tools.jar) and
# have zero runtime interaction with each other (each reads/writes only its own
# uniquely-named .tla/.cfg/log files) — the only real requirement was never
# "technical isolation," just "a failure in one model must not mask or block
# another" at the REPORTING level. That's exactly what this file's own
# "Controls" steps already do within a single model (loop over every config,
# `fail=0` accumulator, never short-circuit on the first failing config) — this
# consolidation applies the identical pattern one level up, across models
# instead of across configs within one model. spec-invariant-xref stays its own
# job: different toolchain (Python, not JDK), already cheap, folding it in
# would only entangle two unrelated toolchains for zero billing benefit.
#
# Tradeoff, stated honestly: wall-clock latency per PR goes UP (7 models now
# run sequentially within one job instead of in parallel across 7 runners,
# worst case sums each model's timeout instead of taking the max) while billed
# minutes go DOWN, which is the actual constraint being optimized against here.

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - 'docs/SPEC_INVARIANTS.md'
      - 'docs/SUBMITPORT_REAL_IMPLEMENTATION_SPEC.md'
      - 'docs/BINANCE_PRIVATE_REST_L4_SPEC.md'
      - 'tools/**'
      - 'formal/**'
      - 'native/include/hengyuan/durable_control_plane.hpp'
      - 'native/include/hengyuan/order_lifecycle.hpp'
      - 'native/include/hengyuan/compaction_lease.hpp'
      - 'native/include/hengyuan/compaction_intent_store.hpp'
      - 'native/include/hengyuan/compaction_intent_codec.hpp'
      - '.github/workflows/ci-spec-verification.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/SPEC_INVARIANTS.md'
      - 'docs/SUBMITPORT_REAL_IMPLEMENTATION_SPEC.md'
      - 'docs/BINANCE_PRIVATE_REST_L4_SPEC.md'
      - 'tools/**'
      - 'formal/**'
      - 'native/include/hengyuan/durable_control_plane.hpp'
      - 'native/include/hengyuan/order_lifecycle.hpp'
      - 'native/include/hengyuan/compaction_lease.hpp'
      - 'native/include/hengyuan/compaction_intent_store.hpp'
      - 'native/include/hengyuan/compaction_intent_codec.hpp'
      - '.github/workflows/ci-spec-verification.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # Pinned to match what the model was developed and verified against locally.
  # Bumping this is a deliberate act: re-run the saturation check afterwards.
  TLA_TOOLS_VERSION: v1.7.4

jobs:
  spec-invariant-xref:
    name: "L1: invariant ledger cross-reference"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Exit code is the gate: 0 = every registered symbol resolves somewhere,
      # 1 = a registered symbol was found in neither the specs nor the ported
      # headers (stale ledger, or a rename applied on one side only),
      # 2 = the ledger itself could not be parsed.
      - name: Cross-reference registered invariants against specs and headers
        run: python tools/spec_xref_check.py --quiet

      # Definition-level check, distinct from the name-level one above. A port can
      # use every right name and still be wrong in the way that matters most:
      # different enumerator VALUES. Three types in durable_control_plane.hpp were
      # once invented rather than transcribed — wrong names AND wrong numbering on
      # a persisted wire discriminator — and both the full unit suite and the
      # name-level check above passed them. Only this catches that.
      # Exit 1 = VALUE_CONFLICT or NAME_CONFLICT; spec-ahead-of-code is a warning.
      - name: Diff spec enum definitions against the real headers
        run: python tools/spec_enum_diff.py

  tla-model-check-all:
    name: "L3: TLA+ model checking (all models)"
    runs-on: ubuntu-24.04
    # Sum-ceiling across 7 sequential models, was 7 x independent 20-min caps
    # possible in parallel before this consolidation -- see this file's header
    # comment for why billed minutes (not wall-clock) is the thing being
    # optimized here.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # tla2tools.jar is gitignored (a 2MB binary does not belong in the tree),
      # so CI fetches the pinned release the same way the local setup does.
      # ONE fetch for all 7 models below, not 7.
      - name: Cache TLA+ tools
        id: cache-tla
        uses: actions/cache@v6
        with:
          path: formal/tools/tla2tools.jar
          key: tla2tools-${{ env.TLA_TOOLS_VERSION }}

      - name: Download TLA+ tools
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: |
          mkdir -p formal/tools
          curl -sSfL -o formal/tools/tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_TOOLS_VERSION}/tla2tools.jar"
          file formal/tools/tla2tools.jar | grep -q 'Java archive' \
            || { echo "::error::downloaded file is not a JAR (release asset moved or network interception?)"; exit 1; }

      # Each model below is `continue-on-error: true` so one model's failure
      # does not skip the remaining models (identical intent to this file's
      # own "Controls" steps: run everything, aggregate at the end). Each
      # model's OWN internal safety->liveness->controls sequence still
      # short-circuits on first failure within its own step (bash's default
      # `set -e` for `run:` blocks) -- that is unchanged from before this
      # consolidation, where a model's own Safety-step failure already skipped
      # its own Liveness/Controls steps in the same job.

      - name: "Model: durable_log_recovery (main design)"
        id: m_durable_log_recovery
        continue-on-error: true
        working-directory: formal
        run: |
          # Safety: current design must find no violation.
          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config durable_log_recovery.cfg durable_log_recovery.tla

          # Liveness: EventualResolution must hold. This config intentionally
          # has no CONSTRAINT (see formal/README.md) -- do not "fix" it by
          # adding one.
          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config durable_log_recovery_liveness.cfg durable_log_recovery.tla

          # Controls: these three MUST fail. TLC exits 12 on an invariant
          # violation, so the check is inverted: a clean exit here means the
          # model has stopped discriminating and every "no violation" result
          # above is worth less. Without this inversion the regression
          # controls would be decorative.
          set -u
          fail=0
          for pair in \
            "durable_log_recovery_buggy.cfg|NoDoubleSend|pre-rev14 recovery bug (Prepared-only frame recovers as Submitting)" \
            "durable_log_recovery_abortedpresend.cfg|NoDoubleSend|pre-rev14 AbortedPreSend compensation (treats Failed append as proof nothing happened)" \
            "durable_log_recovery_probe.cfg|LateFsyncUnreachable|late-fsync reachability probe"
          do
            cfg="${pair%%|*}"; rest="${pair#*|}"
            inv="${rest%%|*}"; desc="${rest#*|}"
            echo "::group::$cfg — expecting $inv to be violated"
            echo "  control: $desc"
            if java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
                 -workers auto -config "$cfg" durable_log_recovery.tla > "/tmp/$cfg.log" 2>&1; then
              echo "::error::$cfg PASSED but was expected to violate $inv. The model has stopped discriminating; do not trust the safety runs until this is fixed."
              tail -30 "/tmp/$cfg.log"
              fail=1
            elif grep -q "Invariant $inv is violated" "/tmp/$cfg.log"; then
              echo "  OK: $inv violated as expected"
            else
              echo "::error::$cfg failed, but NOT with the expected '$inv is violated'. It may be erroring for an unrelated reason (parse error, missing constant), which would silently disable this control."
              tail -30 "/tmp/$cfg.log"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: "Model: freeze_episode_recovery (freeze-episode slice, 轨道 C)"
        id: m_freeze
        continue-on-error: true
        working-directory: formal
        run: |
          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config freeze_episode_recovery.cfg freeze_episode_recovery.tla

          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config freeze_episode_recovery_liveness.cfg freeze_episode_recovery.tla

          set -u
          fail=0
          for pair in \
            "freeze_episode_recovery_wait_ok_bug.cfg|NoPrematureConservativeClear|round-30 forged WaitSatisfied Ack (sink trusts a caller-claimed wait instead of independently verifying)" \
            "freeze_episode_recovery_generation_bug.cfg|WaitSatisfiedOnlyForCurrentGeneration|round-31/32 legacy generation re-match (a stale generation's WaitSatisfied satisfies a newer one)" \
            "freeze_episode_recovery_probe.cfg|AbandonedArmUnreachable|abandoned-Arm-across-restart reachability probe"
          do
            cfg="${pair%%|*}"; rest="${pair#*|}"
            inv="${rest%%|*}"; desc="${rest#*|}"
            echo "::group::$cfg — expecting $inv to be violated"
            echo "  control: $desc"
            if java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
                 -workers auto -config "$cfg" freeze_episode_recovery.tla > "/tmp/$cfg.log" 2>&1; then
              echo "::error::$cfg PASSED but was expected to violate $inv. The model has stopped discriminating; do not trust the safety runs until this is fixed."
              tail -30 "/tmp/$cfg.log"
              fail=1
            elif grep -q "Invariant $inv is violated" "/tmp/$cfg.log"; then
              echo "  OK: $inv violated as expected"
            else
              echo "::error::$cfg failed, but NOT with the expected '$inv is violated'. It may be erroring for an unrelated reason (parse error, missing constant), which would silently disable this control."
              tail -30 "/tmp/$cfg.log"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: "Model: inflight_lifecycle (in-flight slot lifecycle, EXEC-INFLIGHT-003)"
        id: m_inflight
        continue-on-error: true
        working-directory: formal
        run: |
          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config inflight_lifecycle.cfg inflight_lifecycle.tla

          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config inflight_lifecycle_liveness.cfg inflight_lifecycle.tla

          set -u
          cfg=inflight_lifecycle_untracked_bug.cfg
          inv=NoLiveOrderIsUntracked
          echo "::group::$cfg — expecting $inv to be violated"
          echo "  control: pre-audit behaviour (an Accepted order never reaches the reconcile loop, so its slot is unreleasable)"
          if java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
               -workers auto -config "$cfg" inflight_lifecycle.tla > "/tmp/$cfg.log" 2>&1; then
            echo "::error::$cfg PASSED but was expected to violate $inv. The model has stopped discriminating; do not trust the safety run until this is fixed."
            tail -30 "/tmp/$cfg.log"
            exit 1
          fi
          if ! grep -q "Invariant $inv is violated" "/tmp/$cfg.log"; then
            echo "::error::$cfg failed, but NOT with the expected '$inv is violated'. It may be erroring for an unrelated reason (parse error, missing constant), which would silently disable this control."
            tail -30 "/tmp/$cfg.log"
            exit 1
          fi
          echo "  OK: $inv violated as expected"
          echo "::endgroup::"

      - name: "Model: RoundDActual (Round D CandidateLease/IntentStore)"
        id: m_roundd
        continue-on-error: true
        working-directory: formal
        run: |
          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config RoundDActual.cfg RoundDActual.tla

          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config RoundDActual_liveness.cfg RoundDActual.tla

          set -u
          declare -a controls=(
            "RoundDActual_v3bug.cfg|NeverWritesIntoWrongObject|review v3: path-based (not handle-relative) I/O -- TOCTOU lets a write land in a renamed-in directory"
            "RoundDActual_v4bug.cfg|NoCapabilityUseAfterInvalidation|review v4: public handle accessor lets a capability escape the lease's own lifetime"
            "RoundDActual_v5bug.cfg|NonOwnerReleaseNeverClearsHeld|review v5: release() with no owner-thread check -- any thread could clear held"
          )
          for entry in "${controls[@]}"; do
            IFS='|' read -r cfg inv desc <<< "$entry"
            echo "::group::$cfg — expecting $inv to be violated"
            echo "  control: $desc"
            if java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
                 -workers auto -config "$cfg" RoundDActual.tla > "/tmp/$cfg.log" 2>&1; then
              echo "::error::$cfg PASSED but was expected to violate $inv. The model has stopped discriminating; do not trust the safety run until this is fixed."
              tail -30 "/tmp/$cfg.log"
              exit 1
            fi
            if ! grep -q "Invariant $inv is violated" "/tmp/$cfg.log"; then
              echo "::error::$cfg failed, but NOT with the expected '$inv is violated'. It may be erroring for an unrelated reason (parse error, missing constant), which would silently disable this control."
              tail -30 "/tmp/$cfg.log"
              exit 1
            fi
            echo "  OK: $inv violated as expected"
            echo "::endgroup::"
          done

      - name: "Model: RoundEFDesign (Round E/F future .x1/.xgc design)"
        id: m_roundef
        continue-on-error: true
        working-directory: formal
        # No regression control -- see RoundEFDesign.tla's own header and
        # formal/README.md's section for why: it formalizes rules that already
        # exist as real, tested pure functions in compaction_intent_codec.hpp,
        # but for which no production write path exists anywhere in this
        # codebase yet. There is no historical incident to regress against.
        run: |
          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config RoundEFDesign.cfg RoundEFDesign.tla

          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config RoundEFDesign_liveness.cfg RoundEFDesign.tla

      - name: "Model: key_rotation (two-step key rotation, KEY-ROTATE-008)"
        id: m_keyrotation
        continue-on-error: true
        working-directory: formal
        run: |
          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config key_rotation.cfg key_rotation.tla

          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config key_rotation_liveness.cfg key_rotation.tla

          set -u
          cfg=key_rotation_onestep_bug.cfg
          inv=RepairOnlyOnProvenMismatch
          echo "::group::$cfg — expecting $inv to be violated"
          echo "  control: one-step protocol (re-anchor on any anchor-key mismatch, ignoring the sidecar proof)"
          if java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
               -workers auto -config "$cfg" key_rotation.tla > "/tmp/$cfg.log" 2>&1; then
            echo "::error::$cfg PASSED but was expected to violate $inv. The model has stopped discriminating; do not trust the safety run until this is fixed."
            tail -30 "/tmp/$cfg.log"
            exit 1
          fi
          if ! grep -q "Invariant $inv is violated" "/tmp/$cfg.log"; then
            echo "::error::$cfg failed, but NOT with the expected '$inv is violated'. It may be erroring for an unrelated reason (parse error, missing constant), which would silently disable this control."
            tail -30 "/tmp/$cfg.log"
            exit 1
          fi
          echo "  OK: $inv violated as expected"
          echo "::endgroup::"

      - name: "Model: depth_snapshot_bootstrap (MD-BOOK-002)"
        id: m_depthsnapshot
        continue-on-error: true
        working-directory: formal
        run: |
          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config depth_snapshot_bootstrap.cfg depth_snapshot_bootstrap.tla

          java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
            -workers auto -config depth_snapshot_bootstrap_liveness.cfg depth_snapshot_bootstrap.tla

          set -u
          fail=0
          for pair in \
            "depth_snapshot_bootstrap_drop_before_snapshot_bug.cfg|TrackingImpliesBookConsistent|drop-before-snapshot (Buffering discards events instead of buffering them for replay)" \
            "depth_snapshot_bootstrap_overflow_still_track_bug.cfg|NoOverflowThenTracking|overflow-still-tracks (apply_snapshot proceeds over a known-incomplete prefix)" \
            "depth_snapshot_bootstrap_first_bridge_disabled_bug.cfg|FirstBridgeConstraint|bridge-check disabled (Tracking entered without U <= lastUpdateId+1 on the first kept event)"
          do
            cfg="${pair%%|*}"; rest="${pair#*|}"
            inv="${rest%%|*}"; desc="${rest#*|}"
            echo "::group::$cfg — expecting $inv to be violated"
            echo "  control: $desc"
            if java -XX:+UseParallelGC -cp tools/tla2tools.jar tlc2.TLC \
                 -workers auto -config "$cfg" depth_snapshot_bootstrap.tla > "/tmp/$cfg.log" 2>&1; then
              echo "::error::$cfg PASSED but was expected to violate $inv. The model has stopped discriminating; do not trust the safety runs until this is fixed."
              tail -30 "/tmp/$cfg.log"
              fail=1
            elif grep -q "Invariant $inv is violated" "/tmp/$cfg.log"; then
              echo "  OK: $inv violated as expected"
            else
              echo "::error::$cfg failed, but NOT with the expected '$inv is violated'. It may be erroring for an unrelated reason (parse error, missing constant), which would silently disable this control."
              tail -30 "/tmp/$cfg.log"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # Aggregate: turns any individual model's failure into an overall job
      # failure. `if: always()` so this runs even though every model step
      # above is `continue-on-error: true`. Each model's own pass/fail is
      # still independently visible as its own named step in the GitHub UI
      # (a red X on that specific step) -- this step only decides the job's
      # own final status, it does not hide which model(s) failed.
      - name: "Aggregate: fail the job iff any model failed"
        if: always()
        run: |
          fail=0
          [ "${{ steps.m_durable_log_recovery.outcome }}" = "failure" ] && { echo "::error::durable_log_recovery failed"; fail=1; }
          [ "${{ steps.m_freeze.outcome }}" = "failure" ] && { echo "::error::freeze_episode_recovery failed"; fail=1; }
          [ "${{ steps.m_inflight.outcome }}" = "failure" ] && { echo "::error::inflight_lifecycle failed"; fail=1; }
          [ "${{ steps.m_roundd.outcome }}" = "failure" ] && { echo "::error::RoundDActual failed"; fail=1; }
          [ "${{ steps.m_roundef.outcome }}" = "failure" ] && { echo "::error::RoundEFDesign failed"; fail=1; }
          [ "${{ steps.m_keyrotation.outcome }}" = "failure" ] && { echo "::error::key_rotation failed"; fail=1; }
          [ "${{ steps.m_depthsnapshot.outcome }}" = "failure" ] && { echo "::error::depth_snapshot_bootstrap failed"; fail=1; }
          exit $fail

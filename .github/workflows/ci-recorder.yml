name: CI Recorder

# recorder/ is the D0 read-only public-data recorder (Python). Same reasoning as ci-python.yml (AUDIT
# CI-PY-013): main-merge-guard.yml treats "no workflow matched the changed paths" as a PASS, so without a
# workflow of its own a recorder-only PR would merge with zero verification. Independent of the other
# workflows on purpose: a failure in one must not mask or block another.
#
# Three legs:
#   * lock-311  -- CPython 3.11 (the recording host's interpreter) with the exact hash-pinned wheels that
#                  get deployed (requirements.lock, --require-hashes), full tests + ruff.
#   * latest    -- CPython 3.13 with unpinned dependencies: early warning for upstream API drift.
#   * bundle    -- builds the deployment bundle twice and requires byte-identical output, then re-verifies
#                  the unpacked tree against its own manifest.

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - 'recorder/**'
      - '.github/workflows/ci-recorder.yml'
  pull_request:
    branches: [master]
    # no `paths:` on purpose: the `changes` job below decides, so the `gate` job always reports
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Required-check plumbing. This workflow runs on every pull request (the pull_request trigger has no
  # workflow-level `paths:`) so that its `gate` job always reports: GitHub leaves the checks of a path-filtered
  # workflow that did not run "Pending" forever, which would block every unrelated PR once the gate is a
  # required status check. The path decision therefore lives here, at job level, where a skipped job counts
  # as success. Keep the pattern below in step with `push.paths` above.
  changes:
    name: "recorder: changes"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout (a pull request checks out its merge commit; depth 2 brings both parents)
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide whether the paths of this workflow changed
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PATTERN: '^(recorder/|\.github/workflows/ci-recorder\.yml$)'
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "recorder: $EVENT event, run=true" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Fail closed: the diff below is only the pull request's own change set when HEAD is the merge commit.
          if ! git rev-parse --verify --quiet "HEAD^2" > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "recorder: HEAD is not a merge commit, run=true" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # -z: NUL-separated raw names (no quoting of non-ASCII paths). A file rather than a pipe, so that
          # grep -q closing early cannot turn a match into a SIGPIPE failure under pipefail.
          git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed.z"
          if grep -zEq "$PATTERN" "$RUNNER_TEMP/changed.z"; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          {
            echo "### recorder: changes -> run=$run"
            echo '```'
            tr '\0' '\n' < "$RUNNER_TEMP/changed.z"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lock-311:
    name: "recorder: py3.11 + locked wheels"
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: recorder/requirements.lock

      - name: Install locked runtime dependencies and dev tools
        working-directory: recorder
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install "pytest>=8" ruff
          pip install -e . --no-deps

      - name: Run tests
        working-directory: recorder
        run: python -m pytest -q

      - name: Lint
        working-directory: recorder
        run: ruff check .

  latest:
    name: "recorder: py3.13 + latest dependencies"
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: recorder/pyproject.toml

      - name: Install
        working-directory: recorder
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: recorder
        run: python -m pytest -q

  bundle:
    name: "recorder: deployment bundle is reproducible"
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build twice, compare, verify
        working-directory: recorder
        run: |
          python scripts/build_bundle.py --out dist-a
          python scripts/build_bundle.py --out dist-b
          A=$(cat dist-a/*.sha256)
          B=$(cat dist-b/*.sha256)
          echo "a: $A"
          echo "b: $B"
          test "$A" = "$B"
          ( cd dist-a && sha256sum -c ./*.sha256 )
          mkdir unpacked
          tar -xzf dist-a/*.tar.gz -C unpacked
          REL=$(ls unpacked)
          PYTHONPATH="unpacked/$REL" python -B -m hy_recorder.bundle verify "unpacked/$REL" --check-name
          PYTHONPATH="unpacked/$REL" python -B -c "import websockets, zstandard, hy_recorder; print('imports ok', websockets.__version__, zstandard.__version__)"

  # Always runs and is the only check of this workflow meant to be a required status check: it passes only if
  # the path decision succeeded and every guarded job ended exactly as that decision calls for (success when
  # run=true, skipped when run=false). Any other combination, including a failed or cancelled `changes` job,
  # fails it.
  gate:
    name: "recorder: gate"
    needs: [changes, lock-311, latest, bundle]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exactly the outcome the path decision calls for
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          LOCK_311: ${{ needs.lock-311.result }}
          LATEST: ${{ needs.latest.result }}
          BUNDLE: ${{ needs.bundle.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$CHANGES" = "success" ] || fail "the changes job ended as '$CHANGES', not 'success'"
          case "$RUN" in
            true)  want=success ;;
            false) want=skipped ;;
            *)     fail "the changes job gave no run decision ('$RUN')" ;;
          esac
          for pair in "lock-311=$LOCK_311" "latest=$LATEST" "bundle=$BUNDLE"; do
            name="${pair%%=*}"; got="${pair#*=}"
            [ "$got" = "$want" ] || fail "$name ended as '$got', expected '$want' (run=$RUN)"
          done
          echo "gate ok: run=$RUN, every guarded job is '$want'"

name: CI Native Sanitizers

# Runtime instrumentation for the native core. Complements ci-native.yml (which
# builds Release, no instrumentation) — it does NOT replace it and must not be
# merged into it: sanitizer builds are several times slower, and ci-native.yml is
# the fast per-PR gate.
#
# DIVISION OF LABOUR, stated because it is easy to over-read a green run:
#   * ASan+UBSan   memory safety and undefined behaviour. Says NOTHING about
#                  memory ordering — it will not notice an acquire/release pair
#                  downgraded to relaxed.
#   * TSan         data races and memory-ordering bugs, via the C++ memory
#                  model rather than what x86 hardware happened to do. This is
#                  the ONLY check in the repo that can catch such a downgrade on
#                  an x86 runner.
#   * ARM64 job    a hardware verdict rather than a model verdict: on weak
#                  memory a relaxed downgrade genuinely reorders, and the
#                  payload checksums in test_spsc_concurrency.cpp observe it
#                  with no tooling involved.
#
# Weekly rather than nightly: ci-native.yml's own comment flags the private-repo
# 2000 min/month Actions budget as a real constraint. Nightly full-ASan would
# spend roughly a third of it on findings that are rarely time-critical.

permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  asan-ubsan:
    name: "ASan+UBSan: full suite"
    runs-on: ubuntu-24.04
    # A cold full-suite instrumented build can exceed the old 45-minute cap before
    # the test step starts. Keep the memory-safety signal, but give the first run
    # enough room to finish; subsequent runs reuse this build tree.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake libboost-dev libboost-system-dev libssl-dev

      - name: Cache ASan+UBSan build tree
        uses: actions/cache@v6
        with:
          path: native/build-asan
          key: native-build-asan-${{ runner.os }}-gcc14-${{ hashFiles('native/CMakeLists.txt', '.github/workflows/ci-native-sanitizers.yml') }}
          restore-keys: |
            native-build-asan-${{ runner.os }}-gcc14-

      # RelWithDebInfo, not Release: sanitizer reports without symbols are close
      # to useless, and NDEBUG would also compile out every assert() in the tree.
      - name: Configure (ASan+UBSan)
        working-directory: native
        run: |
          cmake -B build-asan \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHY_SANITIZER=address \
            -DHY_BUILD_DEMO=ON

      - name: Build
        working-directory: native
        run: cmake --build build-asan -j$(nproc)

      - name: Test
        working-directory: native/build-asan
        env:
          ASAN_OPTIONS: "detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: ctest --output-on-failure

  tsan-concurrency:
    name: "TSan: concurrency tests + negative control"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake

      - name: Configure (TSan)
        working-directory: native
        run: |
          cmake -B build-tsan \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHY_SANITIZER=thread \
            -DHY_BUILD_TSAN_CONTROL=ON \
            -DHY_BUILD_DEMO=OFF

      # Only the concurrency targets. Building all test binaries under TSan
      # would roughly triple this job for zero added signal: every other test in
      # the tree is single-threaded, and TSan reports nothing in a program with
      # one thread. test_reconcile_concurrency is the real two-thread test for
      # order_tracker.hpp's hot-thread/reconcile-thread split (InFlightRegistry/
      # AuditRingSink owned by one, OrderTracker by the other, synchronized only
      # via SpscRing) -- without it here, that design's actual thread-safety
      # claim would never run under TSan at all.
      # test_shm_heartbeat carries the same kind of claim for ShmControlBlock's
      # seqlock (audit PERF-SHM-004). That protocol is genuinely cross-PROCESS, so
      # TSan can never observe the real writer/watchdog pair; a two-thread
      # in-process exercise of the identical protocol is the closest available
      # check, and it earns its place precisely because the previous non-atomic
      # implementation would have been reported by it instantly.
      # test_snapshot_refresh_gate is the third (audit VERIF-TSAN-016): that class
      # spawns a real std::thread and publishes a mailbox across it, but its header
      # used to name the production REST fetcher as a constructor default, dragging
      # in Boost/OpenSSL and putting the whole binary behind HY_BUILD_DEMO -- which
      # this job turns OFF. The one genuinely-networked test moved to
      # test_binance_rest_snapshot.cpp so the state machine could come here.
      # test_public_feed_supervisor_concurrency is the fourth (批次 6 6b-0f-2): consecutive public-feed
      # session generations pushing into ONE shared SpscRing (whose producer-side cached index is a
      # plain variable, so it is only legal because every push comes from the single I/O thread),
      # with the supervisor and the ring's only consumer on the other thread.
      # test_single_flight_fetch_gate is the fifth (批次 6 6b-0f-3a): a generic worker-thread fetch
      # gate whose mailbox is handed across threads, like SnapshotRefreshGate but injected-clock.
      # test_kline_feed_driver is the sixth (批次 6 6b-0f-3c): the per-tick recovery orchestration
      # driving that gate's real worker thread under a real supervisor/sync/ring.
      # test_depth_feed_driver is the seventh (批次 6 6b-0f-6): the depth-side mirror of
      # test_kline_feed_driver -- SnapshotRefreshGate's real worker thread under a real
      # PublicFeedSupervisor/DepthManager/InputValidator/ring.
      # NOTE this job builds an explicit target list: a test that merely carries the `concurrency`
      # label but is not named here is never built, so `ctest -L concurrency` below silently never
      # runs it.
      - name: Build concurrency targets only
        working-directory: native
        run: |
          cmake --build build-tsan -j$(nproc) \
            --target test_spsc_concurrency test_reconcile_concurrency test_shm_heartbeat \
            test_snapshot_refresh_gate test_public_feed_supervisor_concurrency \
            test_single_flight_fetch_gate test_kline_feed_driver test_depth_feed_driver \
            tsan_control_relaxed_ring tsan_control_export_worker_dual_consumer

      # history_size=7 (the maximum) is the single biggest lever on whether a
      # race whose two halves are separated in time gets reported at all — it
      # multiplies how much per-thread access history TSan retains.
      - name: Run concurrency tests under TSan
        working-directory: native/build-tsan
        env:
          TSAN_OPTIONS: "history_size=7:halt_on_error=1:exitcode=66"
        run: ctest -L concurrency --output-on-failure

      # NEGATIVE CONTROL — this binary MUST fail. Same discipline as the
      # expected-to-fail TLA+ configs in ci-spec-verification.yml.
      #
      # A "no data races found" result above is evidence only if TSan on this
      # runner, with these flags, would actually have reported one. The control
      # is a ring with the release/acquire pair removed; if it passes, the gate
      # is broken and every clean TSan run above is unsubstantiated.
      #
      # The grep is not redundant with the exit-code check: a non-zero exit could
      # equally mean a missing runtime, flag drift, or a build error, any of which
      # would silently disable this control while looking like it was working.
      - name: "Control: TSan MUST flag the deliberately-relaxed ring"
        working-directory: native/build-tsan
        env:
          TSAN_OPTIONS: "history_size=7:halt_on_error=1:exitcode=66"
        run: |
          set -u
          if ./tsan_control_relaxed_ring > control.log 2>&1; then
            echo "::error::tsan_control_relaxed_ring exited 0. TSan did NOT detect the injected missing release/acquire pair on this runner. Every 'no data races found' result in this job is unsubstantiated — do not trust the TSan gate until this is fixed."
            tail -50 control.log
            exit 1
          fi
          if ! grep -q "WARNING: ThreadSanitizer: data race" control.log; then
            echo "::error::tsan_control_relaxed_ring failed, but NOT with a ThreadSanitizer data-race report. It is probably failing for an unrelated reason (missing runtime, flag drift, build error), which would silently disable this control."
            tail -50 control.log
            exit 1
          fi
          echo "OK: TSan reported the injected race as expected — the gate is live."

      # Phase 5 (docs/SPEC_INVARIANTS.md): same discipline, for
      # ExportOutboxRing's documented single-consumer contract -- two threads
      # deliberately both drive its consumer-side API concurrently.
      - name: "Control: TSan MUST flag the deliberate dual-consumer ExportOutboxRing misuse"
        working-directory: native/build-tsan
        env:
          TSAN_OPTIONS: "history_size=7:halt_on_error=1:exitcode=66"
        run: |
          set -u
          if ./tsan_control_export_worker_dual_consumer > control_export_worker.log 2>&1; then
            echo "::error::tsan_control_export_worker_dual_consumer exited 0. TSan did NOT detect the injected dual-consumer race on this runner. Every 'no data races found' result in this job is unsubstantiated — do not trust the TSan gate until this is fixed."
            tail -50 control_export_worker.log
            exit 1
          fi
          if ! grep -q "WARNING: ThreadSanitizer: data race" control_export_worker.log; then
            echo "::error::tsan_control_export_worker_dual_consumer failed, but NOT with a ThreadSanitizer data-race report. It is probably failing for an unrelated reason (missing runtime, flag drift, build error), which would silently disable this control."
            tail -50 control_export_worker.log
            exit 1
          fi
          echo "OK: TSan reported the injected dual-consumer race as expected — the gate is live."

  arm64-weak-memory:
    name: "ARM64 Release: hardware weak-memory verdict"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    # The only HARDWARE check of spsc_ring.hpp's memory orders. TSan gives a
    # model verdict on x86; this runs uninstrumented Release on an architecture
    # where a relaxed downgrade actually reorders, and the payload checksums in
    # test_spsc_concurrency.cpp are what observe it.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake

      - name: Configure (Release, no sanitizer)
        working-directory: native
        run: |
          cmake -B build-arm \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=Release \
            -DHY_BUILD_DEMO=OFF

      # AUDIT CI-ARM-022: this used to build test_spsc_concurrency alone, so
      # test_reconcile_concurrency's memory orders -- and now
      # test_shm_heartbeat's seqlock -- never got a hardware verdict on weak
      # memory, only TSan's model verdict on x86. The `ctest -L concurrency`
      # selection below already expected all of them.
      - name: Build concurrency targets only
        working-directory: native
        run: |
          cmake --build build-arm -j$(nproc) \
            --target test_spsc_concurrency test_reconcile_concurrency test_shm_heartbeat \
            test_public_feed_supervisor_concurrency test_single_flight_fetch_gate \
            test_kline_feed_driver

      # Repeated: unlike TSan's model-level verdict, a weak-memory violation is
      # probabilistic per run. Ten Release-speed runs cost seconds and raise the
      # detection floor substantially.
      - name: Run concurrency tests (10x)
        working-directory: native/build-arm
        run: ctest -L concurrency --output-on-failure --repeat until-fail:10

name: CodeQL

on:
  schedule:
    - cron: "23 18 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Skip CodeQL on current private-repo plan
        if: ${{ github.event.repository.private }}
        run: |
          echo "CodeQL SARIF upload is unavailable on the current private-repo plan because GitHub Advanced Security has not been purchased."
          echo "Skipping CodeQL analysis instead of failing on an unavailable repository feature."

      - name: Install build tools (targeted Boost components only)
        if: ${{ !github.event.repository.private }}
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake libboost-dev libboost-system-dev libssl-dev

      - name: Cache CMake build tree
        if: ${{ !github.event.repository.private }}
        uses: actions/cache@v4
        with:
          path: native/build
          key: native-build-${{ runner.os }}-gcc14-${{ hashFiles('native/CMakeLists.txt') }}
          restore-keys: |
            native-build-${{ runner.os }}-gcc14-

      - name: Initialize CodeQL
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual

      - name: Build (manual mode — CMake + FetchContent needs it, autobuild is unreliable here)
        if: ${{ !github.event.repository.private }}
        working-directory: native
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release -DHY_BUILD_DEMO=ON
          cmake --build build -j$(nproc)

      - name: Perform CodeQL Analysis
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/analyze@v4

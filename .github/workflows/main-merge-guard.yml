name: Main Merge Guard

on:
  push:
    branches: [master]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read

concurrency:
  group: main-merge-guard-main
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Evaluate pushed commit
        id: evaluate
        uses: actions/github-script@v9
        with:
          script: |
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const headMessage = context.payload.head_commit?.message ?? "";
            const firstLine = headMessage.split("\n")[0];

            if (
              context.actor === "github-actions[bot]" ||
              headMessage.startsWith("revert(main-merge-guard):")
            ) {
              core.setOutput("mode", "skip");
              core.setOutput("reason", "guard_revert_or_bot_push");
              return;
            }

            const { owner, repo } = context.repo;

            const findMergedMainPr = (pullRequests) => {
              return pullRequests.find((pr) => pr.base.ref === "master" && pr.merged_at);
            };

            // Verify a PR by number: must be merged to main with merge_commit_sha === context.sha.
            // This invariant prevents bypass by crafting a commit message that looks like a merged PR.
            const verifyMergedMainPr = async (prNumber, source) => {
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                });
                if (
                  pr.base.ref === "master" &&
                  Boolean(pr.merged_at) &&
                  pr.merge_commit_sha === context.sha
                ) {
                  return pr;
                }
                core.info(
                  `${source} fallback matched PR #${prNumber}, but does not resolve to merged main commit ${context.sha} ` +
                  `(base=${pr.base.ref} merged_at=${pr.merged_at} merge_commit_sha=${pr.merge_commit_sha}).`,
                );
                return null;
              } catch (error) {
                core.info(`${source} fallback failed for PR #${prNumber}: ${error.message}`);
                return null;
              }
            };

            // Primary path: association lookup with retries.
            // GitHub's commit-to-PR association has eventual consistency; squash-merge commits
            // in particular may not be indexed immediately when the guard first runs.
            let mergedPr = null;
            for (let assocAttempt = 1; assocAttempt <= 3; assocAttempt += 1) {
              const associated = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: context.sha },
              );
              mergedPr = findMergedMainPr(associated);
              if (mergedPr) break;
              if (assocAttempt < 3) {
                core.info(`Association lookup attempt ${assocAttempt}: not found yet; retrying in 5s...`);
                await sleep(5000);
              }
            }

            // Fallback 1: standard GitHub merge commit ("Merge pull request #N from ...").
            // GitHub can surface the merge commit before commit-to-PR association is populated.
            if (!mergedPr) {
              const mergeCommitMatch = firstLine.match(/^Merge pull request #(\d+) from /);
              if (mergeCommitMatch) {
                mergedPr = await verifyMergedMainPr(Number(mergeCommitMatch[1]), "merge-commit");
              }
            }

            // Fallback 2: GitHub squash merge commit (first line ends with "(#N)").
            // GitHub appends " (#N)" to the PR title when squash-merging; the new commit's
            // merge_commit_sha on the merged PR must equal context.sha to be accepted.
            if (!mergedPr) {
              const squashMergeMatch = firstLine.match(/\(#(\d+)\)\s*$/);
              if (squashMergeMatch) {
                mergedPr = await verifyMergedMainPr(Number(squashMergeMatch[1]), "squash-merge");
              }
            }

            if (!mergedPr) {
              core.setOutput("mode", "revert");
              core.setOutput("reason", "direct_push_without_merged_pr");
              core.setOutput("state", "MISSING");
              core.setOutput("details", "no merged PR associated with pushed commit");
              return;
            }

            core.setOutput("pr_number", String(mergedPr.number));

            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    statusCheckRollup {
                      state
                    }
                  }
                }
              }
            `;

            let finalState = "PENDING";
            let detailSummary = "status-check-rollup-unavailable";

            for (let attempt = 1; attempt <= 15; attempt += 1) {
              try {
                const result = await github.graphql(query, {
                  owner,
                  repo,
                  number: mergedPr.number,
                });

                const rollup = result.repository.pullRequest.statusCheckRollup;
                finalState = rollup?.state ?? "PENDING";
                detailSummary = `rollup-state:${finalState}`;
              } catch (error) {
                finalState = "PENDING";
                detailSummary = `status-query-error: ${error.message}`;
              }

              core.info(`Attempt ${attempt}: PR #${mergedPr.number} rollup=${finalState}`);
              core.info(detailSummary);

              if (finalState === "SUCCESS") {
                core.setOutput("mode", "ok");
                core.setOutput("reason", "pr_checks_success");
                core.setOutput("state", finalState);
                core.setOutput("details", detailSummary);
                return;
              }

              if ((finalState === "PENDING" || finalState === "EXPECTED") && attempt < 15) {
                await sleep(20000);
                continue;
              }

              break;
            }

            core.setOutput("mode", "revert");
            core.setOutput("reason", `pr_${mergedPr.number}_status_${finalState.toLowerCase()}`);
            core.setOutput("state", finalState);
            core.setOutput("details", detailSummary);

      - name: Guard summary
        run: |
          {
            echo "## Main Merge Guard"
            echo
            echo "- mode: ${{ steps.evaluate.outputs.mode }}"
            echo "- reason: ${{ steps.evaluate.outputs.reason }}"
            echo "- state: ${{ steps.evaluate.outputs.state }}"
            echo "- pr_number: ${{ steps.evaluate.outputs.pr_number }}"
            echo "- details: ${{ steps.evaluate.outputs.details }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout master for revert
        if: steps.evaluate.outputs.mode == 'revert'
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git identity
        if: steps.evaluate.outputs.mode == 'revert'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Revert offending push
        if: steps.evaluate.outputs.mode == 'revert'
        env:
          TARGET_SHA: ${{ github.sha }}
          REVERT_REASON: ${{ steps.evaluate.outputs.reason }}
        run: |
          parents="$(git rev-list --parents -n 1 "$TARGET_SHA")"
          if [ "$(wc -w <<<"$parents")" -gt 2 ]; then
            git revert -m 1 --no-edit "$TARGET_SHA"
          else
            git revert --no-edit "$TARGET_SHA"
          fi

          git commit --amend -m "revert(main-merge-guard): auto-revert $TARGET_SHA ($REVERT_REASON)"
          git push origin HEAD:master

      - name: Mark guard failure
        if: steps.evaluate.outputs.mode == 'revert'
        run: |
          echo "main-merge-guard reverted ${{ github.sha }} because ${{ steps.evaluate.outputs.reason }}" >&2
          exit 1

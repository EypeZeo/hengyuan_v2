\* REGRESSION CONTROL #2 -- THIS CONFIG MUST FAIL.
\*
\* RejectSnapshotOnOverflow = FALSE reinstates the overflow-still-tracks bug:
\* apply_snapshot() proceeds with the snapshot even though the buffered
\* prefix is known-incomplete (buf_overflowed_ is set because events were
\* dropped while the buffer was full). The real code refuses to trust a
\* replay it knows is missing events (depth_manager.hpp:150-158, test
\* OverflowedBufferForcesResyncInsteadOfTracking): entering Tracking with
\* the overflow flag still set means the book silently has a hole the
\* machine will never notice.
\*
\* Expected: `Invariant NoOverflowThenTracking is violated`.
\*
\* If this config ever stops failing, the model has stopped discriminating
\* the fail-closed overflow protection and every "no violation" result from
\* depth_snapshot_bootstrap.cfg is worth less.
SPECIFICATION Spec

CONSTANTS
    MaxSeq                  = 5
    MaxBufferLen            = 3
    MaxDeliveries           = 6
    BufferEventsInBuffering = TRUE
    RejectSnapshotOnOverflow = FALSE
    CheckFirstBridge        = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoOverflowThenTracking
    StaleIncrementsDropped
    FirstBridgeConstraint
    TrackingGapForcesRebuffer
    SequenceAlwaysConsumedOnRejection
    TrackingImpliesBookConsistent

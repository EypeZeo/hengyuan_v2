\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* AtomicClaim = FALSE.
\* The revocation test is a step of its own and the claim trusts its answer (blueprint 5.9.2: "seven independent
\* loads and then a plain call is not a proof"). Observe (clear) -> Revoke -> Claim: the order is claimed while a
\* revocation is latched.
\*
\* Expected: `Invariant NoClaimUnderRevoke is violated`.
SPECIFICATION Spec


\* REACHABILITY PROBE -- THIS CONFIG MUST FAIL.
\*
\* Asserts NotSentNeverDurable, a claim we WANT refuted: a NotSent frame can become durable at all (the closing path of the design is explored).
\* If TLC cannot violate it, the main config's "no error" says nothing about that scenario.
\*
\* Expected: `Invariant NotSentNeverDurable is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = TRUE
    ReconcileConcludesAbsent    = TRUE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    NotSentNeverDurable

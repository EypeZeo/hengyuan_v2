\* REGRESSION CONTROL — THIS CONFIG MUST FAIL.
\*
\* DownOnDisconnect = FALSE: observe() ignores a session that is not connected. Disconnecting changes nothing for the barrier until a new
\* generation shows up, so the token is issued while the stream is down (design R9: "remove 'disconnect -> Down' and the invariant must break").
\*
\* Expected: `Invariant TokensOnlyWhenReady is violated`.
\*
\* If this config ever stops failing, the model has stopped discriminating the property it exists for (see reconnect_sweep_bypass_fifo_bug.cfg).

SPECIFICATION Spec

CONSTANTS
    ORDERS           = {o1, o2}
    MaxGen           = 2
    MaxEpoch         = 4
    MaxDrops         = 1
    EvCap            = 3
    ReqCap           = 2
    TakeBeforeDrain  = TRUE
    MarkerInBand     = TRUE
    EpochChecked     = TRUE
    ObserveFirst     = TRUE
    DownOnDisconnect = FALSE

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReconciledIsSwept
    TokensOnlyWhenReady

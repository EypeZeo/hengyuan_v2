\* What reconciliation's inability to conclude "absent" does NOT break. ReconcileConcludesAbsent = FALSE: reconciling an
\* Ambiguous order can only ever end in "the exchange HAS it" -- the tree today (query_order() folds every answer that is
\* not a positive match, an unknown-order error included, into Inconclusive). Every invariant of the design config.
\* Expected result: TLC finds ZERO invariant violations -- safety does not depend on it, progress does.
SPECIFICATION Spec

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = TRUE
    ReconcileConcludesAbsent    = FALSE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoDoubleSend
    SendImpliesDurablePrepared
    NotSentImpliesNeverCrossed
    ClosedNotSentIsTrue
    ClosedNotSentIsDurable
    ReleaseNeedsProof
    NoClaimUnderRevoke
    SendRequiresClaim
    ClaimRejectExclusive
    ReplayLegal
    TerminalIsStable
    FencedWriterMakesNoNewWrites
    OutcomeMatchesGroundTruth
    ExchangeOnlyHasSentOrders
    PendingWellFormed

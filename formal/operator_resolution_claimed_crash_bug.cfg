\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* FenceFromLock = FALSE.
\* The fence starts at a crash time the OPERATOR claims instead of the tool's own lock. He (wrongly, or carelessly) says the process
\* died a full window ago; the request, signed just before the process died, is still acceptable.
\*
\* Expected: `Invariant ClosedAbsentIsTrue is violated`.
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE IN ANY OF THIS MODEL'S CONFIGS. !!!
\* Time is relative and saturating (see the model header), so the graph is finite without one -- and a constraint would
\* make the liveness runs unsound (durable_log_recovery_liveness.cfg explains why).
SPECIFICATION Spec

CONSTANTS
    ExclusiveOpen               = TRUE
    FenceFromLock               = FALSE
    FenceChecked                = TRUE
    LagAllowance                = TRUE
    ChecksExchange              = TRUE
    OperatorPathExists          = TRUE
    ReconcileResolvesExisting   = TRUE
    Window                      = 2
    Lag                         = 1
    MaxCrashes                  = 1
    MaxAborts                   = 1

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ClosedAbsentIsTrue

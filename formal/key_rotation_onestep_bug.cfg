\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* RepairOnlyWhenProven = FALSE reinstates the simpler (but wrong) protocol
\* that the (a)(b)(c) review explicitly warned against: recovery decides
\* whether to re-anchor the main tip from the main anchor's key_id alone
\* (mismatch vs the configured key => rewrite), ignoring the sidecar's
\* durable proof entirely. That turns an operator misconfiguration ("no
\* rotation ever happened, but restart configured with the new key") or a
\* stale config into a silently "repaired" log instead of the required
\* fail-closed Corrupt + fence, and it is exactly the class of confusion the
\* sidecar consultation (durable_audit_sink.hpp:838-846) exists to prevent.
\*
\* Expected: `Invariant RepairOnlyOnProvenMismatch is violated`.
\*
\* If this config ever stops failing, the model has stopped discriminating
\* the protection KEY-ROTATE-008 added, and every "no violation" result
\* from key_rotation.cfg is worth correspondingly less. Same inversion
\* discipline as durable_log_recovery_buggy.cfg and the TSan negative
\* controls.
SPECIFICATION Spec

CONSTANTS
    MaxCrashes           = 2
    RepairOnlyWhenProven = FALSE

CHECK_DEADLOCK FALSE

\* NoDataUnverifiableAfterRotation is deliberately NOT checked here: the
\* one-step bug's unproven repair can also write an anchor under a key that
\* is not loadable, violating it as a side effect -- reporting that instead
\* of (or before) RepairOnlyOnProvenMismatch would make the control's CI
\* grep ambiguous. The bug's OWN signature is the unproven repair.
INVARIANTS
    TypeOK
    AnchorImpliesNonEmptyLog
    RepairOnlyOnProvenMismatch
    IoFailureFencesRotationOrSink
    FlipOnlyAfterStepsDurable

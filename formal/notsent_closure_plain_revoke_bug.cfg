\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* ExclusiveDecision = FALSE.
\* A revoker overwrites a decision that was already taken with a plain store instead of a compare-and-swap from
\* Undecided. Claim -> Send -> Reject (overwrites) -> NotSent lands for an order that is on the wire.
\*
\* Expected: `Invariant NotSentImpliesNeverCrossed is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = FALSE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = TRUE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NotSentImpliesNeverCrossed

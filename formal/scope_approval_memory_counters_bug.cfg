\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* RebuildFromLog = FALSE.
\* After a restart the in-memory used-budget counters simply start from zero instead of being recomputed from the durable
\* charges. Claim -> crash -> recover -> a second order is admitted against a counter that forgot the first.
\*
\* Expected: `Invariant BudgetNeverExceeded is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = TRUE
    ChargeBeforeClaim       = TRUE
    RebuildFromLog          = FALSE
    ChargeHeldUntilResolved = TRUE
    ReplayGuard             = TRUE
    BindStore               = TRUE
    LatestWins              = TRUE
    RevokeAckAfterDurable   = TRUE
    KillInvalidatesScope    = TRUE
    AbsoluteExpiry          = TRUE
    RequireClockToken       = TRUE
    PessimisticExpiry       = TRUE
    MaxCrashes              = 2
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    BudgetNeverExceeded

\* REGRESSION CONTROL #1 -- NOT the current design.
\* Reintroduces round-30's bug: the sink Acks a WaitSatisfied frame without
\* independently verifying real elapsed wait time -- it trusts whatever the
\* caller's frame claims (docs/SPEC_INVARIANTS.md: "此前调用方可以在 wait 真正
\* 满足前伪造 Ack").
\*
\* Expected result: TLC finds a NoPrematureConservativeClear counterexample,
\* along roughly: DetectFreeze -> ArmWait -> Land -> Ack (armedThisSession) ->
\* ClaimWaitSatisfied (groundTruthOk=FALSE, waitElapsedEnough never became
\* TRUE) -> Land -> Ack (guard vacuously satisfied since the toggle is FALSE)
\* -> ClearViaConservativeWaitCompleted -> Land -> Ack -> clearKind is now
\* ConservativeWaitCompleted while satisfied.groundTruthOk = FALSE.
SPECIFICATION Spec

CONSTANTS
    SinkVerifiesWaitIndependently   = FALSE
    PromoteLegacyGenerationCorrectly = TRUE
    MaxCrashes                      = 1
    MaxAppendFailures               = 1
    MaxProbeTries                   = 1
    MaxEpisodeEvents                = 1

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoPrematureConservativeClear

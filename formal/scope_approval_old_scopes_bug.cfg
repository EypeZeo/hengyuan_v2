\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* LatestWins = FALSE.
\* Installing a newer grant does not retire the older live one: the Owner re-signs a narrower scope and orders still go
\* out under the old, wider one.
\*
\* Expected: `Invariant NoClaimUnderSuperseded is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = TRUE
    ChargeBeforeClaim       = TRUE
    RebuildFromLog          = TRUE
    ChargeHeldUntilResolved = TRUE
    ReplayGuard             = TRUE
    BindStore               = TRUE
    LatestWins              = FALSE
    RevokeAckAfterDurable   = TRUE
    KillInvalidatesScope    = TRUE
    AbsoluteExpiry          = TRUE
    RequireClockToken       = TRUE
    PessimisticExpiry       = TRUE
    MaxCrashes              = 2
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoClaimUnderSuperseded

\* REGRESSION CONTROL #1 -- THIS CONFIG MUST FAIL.
\*
\* BufferEventsInBuffering = FALSE reinstates the drop-before-snapshot bug:
\* events that arrive while the manager is Buffering (waiting for the REST
\* snapshot) are DISCARDED instead of buffered for replay. When the snapshot
\* finally lands, the replay applies a prefix that is missing those events --
\* and the real replay has NO mid-buffer continuity check after the first
\* kept event (depth_manager.hpp:172-197), so the hole is invisible to the
\* machine itself: it enters Tracking on a book that diverges from what a
\* never-drop reference implementation would have built.
\*
\* Expected: `Invariant TrackingImpliesBookConsistent is violated`.
\*
\* If this config ever stops failing, the model has stopped discriminating
\* the "stale data must be dropped but live data must be buffered" boundary
\* that test_depth_manager.cpp's BuffersEventsBeforeSnapshot /
\* OverflowedBufferForcesResyncInsteadOfTracking pin down, and every "no
\* violation" result from depth_snapshot_bootstrap.cfg is worth less.
SPECIFICATION Spec

CONSTANTS
    MaxSeq                  = 5
    MaxBufferLen            = 3
    MaxDeliveries           = 6
    BufferEventsInBuffering = FALSE
    RejectSnapshotOnOverflow = TRUE
    CheckFirstBridge        = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoOverflowThenTracking
    StaleIncrementsDropped
    FirstBridgeConstraint
    TrackingGapForcesRebuffer
    SequenceAlwaysConsumedOnRejection
    TrackingImpliesBookConsistent

\* REGRESSION CONTROL — THIS CONFIG MUST FAIL.
\*
\* EpochChecked = FALSE: the barrier honours a SweepDone marker whatever epoch it carries, as long as a request is outstanding. A marker that
\* answers a sweep which a later lost event or generation change made obsolete then completes the NEW sweep: the barrier is Reconciled on an
\* answer from before the trouble, with orders admitted since not covered.
\*
\* Expected: `Invariant ReconciledIsSwept is violated`.
\*
\* If this config ever stops failing, the model has stopped discriminating the property it exists for (see reconnect_sweep_bypass_fifo_bug.cfg).

SPECIFICATION Spec

CONSTANTS
    ORDERS           = {o1, o2}
    MaxGen           = 2
    MaxEpoch         = 4
    MaxDrops         = 1
    EvCap            = 3
    ReqCap           = 2
    TakeBeforeDrain  = TRUE
    MarkerInBand     = TRUE
    EpochChecked     = FALSE
    ObserveFirst     = TRUE
    DownOnDisconnect = TRUE

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReconciledIsSwept
    TokensOnlyWhenReady

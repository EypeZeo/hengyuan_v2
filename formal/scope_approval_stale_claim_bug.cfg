\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* AtomicScopeClaim = FALSE.
\* "Is the grant still live?" is read in a step of its own and the claim trusts the answer (the "seven independent loads
\* and then a plain call" shape of blueprint 5.9.2). Observe (live) -> the Owner revokes, durably, and is told -> claim:
\* an order is claimed after the Owner was told "revoked".
\*
\* Expected: `Invariant NoClaimAfterRevokeAck is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = FALSE
    ChargeBeforeClaim       = TRUE
    RebuildFromLog          = TRUE
    ChargeHeldUntilResolved = TRUE
    ReplayGuard             = TRUE
    BindStore               = TRUE
    LatestWins              = TRUE
    RevokeAckAfterDurable   = TRUE
    KillInvalidatesScope    = TRUE
    AbsoluteExpiry          = TRUE
    RequireClockToken       = TRUE
    PessimisticExpiry       = TRUE
    MaxCrashes              = 2
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoClaimAfterRevokeAck

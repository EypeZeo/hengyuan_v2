\* What the exclusive log lock is NOT needed for. RecoveryWaitsForWriter = FALSE (a successor may scan while the
\* predecessor's last write is still in flight), every invariant of the design config EXCEPT ReplayLegal.
\* Expected result: TLC finds ZERO invariant violations -- the lock protects the replay sequence, not safety.
SPECIFICATION Spec

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = FALSE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoDoubleSend
    SendImpliesDurablePrepared
    NotSentImpliesNeverCrossed
    ClosedNotSentIsTrue
    ClosedNotSentIsDurable
    ReleaseNeedsProof
    NoClaimUnderRevoke
    SendRequiresClaim
    ClaimRejectExclusive
    TerminalIsStable
    FencedWriterMakesNoNewWrites
    OutcomeMatchesGroundTruth
    ExchangeOnlyHasSentOrders
    PendingWellFormed

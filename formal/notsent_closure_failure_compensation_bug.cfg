\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* NoCompensationOnFailure = FALSE.
\* Revision 13's AbortedPreSend, reintroduced: a Failed append is read as "it did not happen", the order is
\* released and rewound, and it is sent a second time. The same control as durable_log_recovery_abortedpresend.cfg,
\* but inside this model, so the new protocol cannot quietly regress to it.
\*
\* Expected: `Invariant NoDoubleSend is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = FALSE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = TRUE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoDoubleSend

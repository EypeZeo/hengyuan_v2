\* REACHABILITY PROBE -- THIS CONFIG MUST FAIL.
\*
\* Shows that an order can be on the wire while its grant was revoked and the Owner told: claim first, revoke second (no recall).
\*
\* Expected: `Invariant SentThenRevokedNeverHappens is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = TRUE
    ChargeBeforeClaim       = TRUE
    RebuildFromLog          = TRUE
    ChargeHeldUntilResolved = TRUE
    ReplayGuard             = TRUE
    BindStore               = TRUE
    LatestWins              = TRUE
    RevokeAckAfterDurable   = TRUE
    KillInvalidatesScope    = TRUE
    AbsoluteExpiry          = TRUE
    RequireClockToken       = TRUE
    PessimisticExpiry       = TRUE
    MaxCrashes              = 2
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    SentThenRevokedNeverHappens

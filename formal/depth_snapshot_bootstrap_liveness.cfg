\* LIVENESS run: every Buffering episode eventually reaches Tracking with a
\* consistent book.
\*
\* Expected result: no EventualBootstrap counterexample.
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE HERE. DO NOT ADD ONE. !!!
\* Same reasoning as durable_log_recovery_liveness.cfg: TLC's liveness
\* checker runs on the CONSTRAINED state graph. A state whose successors
\* were all pruned by a constraint has no outgoing edges, so TLC treats
\* stuttering there as a legal infinite behavior and reports a false
\* counterexample that looks exactly like a real deadlock. Finiteness here
\* comes from the ACTION GUARDS instead: deliveries_left bounds DeliverEvent
\* (the same modeling-budget role as MaxCrashes in durable_log_recovery.tla),
\* the buffer is length-bounded, and every other variable has a finite
\* domain.
\*
\* The fairness assumption WF_vars(ApplySnapshot) is the honest operational
\* fact, not a TLC convenience: the hot thread polls needs_snapshot() every
\* iteration and SnapshotRefreshGate (snapshot_refresh_gate.hpp) fetches
\* asynchronously, retrying after each failure's finite kCooldown -- so the
\* fetch+apply cycle is eventually taken and eventually succeeds. Every
\* fetch-reject / bridge-resync cycle consumes the delivery budget, so after
\* finitely many cycles a fetch lands in Tracking. See the model header's
\* LIVENESS section and formal/README.md.
SPECIFICATION SpecLive

CONSTANTS
    MaxSeq                  = 5
    MaxBufferLen            = 3
    MaxDeliveries           = 6
    BufferEventsInBuffering = TRUE
    RejectSnapshotOnOverflow = TRUE
    CheckFirstBridge        = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    NoOverflowThenTracking
    FirstBridgeConstraint
    TrackingImpliesBookConsistent

PROPERTY EventualBootstrap

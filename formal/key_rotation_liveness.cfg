\* LIVENESS run: every crash is eventually followed by a consistent (or
\* fail-closed-fenced) process state.
\*
\* Expected result: no EventualConsistencyOrFenced counterexample.
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE HERE. DO NOT ADD ONE. !!!
\* Same reasoning as durable_log_recovery_liveness.cfg: TLC's liveness
\* checker runs on the CONSTRAINED state graph. A state whose successors
\* were all pruned by a constraint has no outgoing edges, so TLC treats
\* stuttering there as a legal infinite behavior and reports a false
\* counterexample that looks exactly like a real deadlock. Finiteness here
\* comes from the ACTION GUARDS instead: crashes_left bounds Crash, and
\* every other variable has a finite domain -- which is why the crash budget
\* is a guarded variable, not a constraint clause.
\*
\* The fairness assumption WF_vars(RecoveryScan) is the honest operational
\* fact, not a TLC convenience: a crashed process is restarted by the
\* supervisor, and DurableAuditSink's constructor unconditionally runs both
\* recovery scans -- so the scan, including the interrupted-rotation
\* re-anchor I/O, is eventually taken and eventually succeeds (see the
\* model header's LIVENESS section and formal/README.md).
SPECIFICATION SpecLive

CONSTANTS
    MaxCrashes           = 2
    RepairOnlyWhenProven = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    RepairOnlyOnProvenMismatch
    FlipOnlyAfterStepsDurable

PROPERTY EventualConsistencyOrFenced

\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* BindStore = FALSE.
\* A grant does not name the store it was signed for. The durable store is replaced by an empty one (high-water mark 0, no
\* charges), the old grant installs into it, and its spent budget is new again.
\*
\* Expected: `Invariant BudgetNeverExceeded is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = TRUE
    ChargeBeforeClaim       = TRUE
    RebuildFromLog          = TRUE
    ChargeHeldUntilResolved = TRUE
    ReplayGuard             = TRUE
    BindStore               = FALSE
    LatestWins              = TRUE
    RevokeAckAfterDurable   = TRUE
    KillInvalidatesScope    = TRUE
    AbsoluteExpiry          = TRUE
    RequireClockToken       = TRUE
    PessimisticExpiry       = TRUE
    MaxCrashes              = 2
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    BudgetNeverExceeded

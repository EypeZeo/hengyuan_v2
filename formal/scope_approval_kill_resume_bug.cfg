\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* KillInvalidatesScope = FALSE.
\* The durable kill latch only blocks claims; it does not revoke the live grant. The operator clears the latch and trading
\* resumes under a grant the Owner signed before the incident, without the Owner signing anything.
\*
\* Expected: `Invariant NoClaimUnderKilledScope is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = TRUE
    ChargeBeforeClaim       = TRUE
    RebuildFromLog          = TRUE
    ChargeHeldUntilResolved = TRUE
    ReplayGuard             = TRUE
    BindStore               = TRUE
    LatestWins              = TRUE
    RevokeAckAfterDurable   = TRUE
    KillInvalidatesScope    = FALSE
    AbsoluteExpiry          = TRUE
    RequireClockToken       = TRUE
    PessimisticExpiry       = TRUE
    MaxCrashes              = 2
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoClaimUnderKilledScope

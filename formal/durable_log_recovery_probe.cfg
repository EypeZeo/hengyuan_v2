\* REACHABILITY PROBE -- this config is EXPECTED TO FAIL.
\*
\* LateFsyncUnreachable is not an invariant of anything; it is a claim we want
\* TLC to REFUTE. `state[c] = "Intent"` coexisting with a durable Prepared frame
\* for c is the unique signature of "the bytes landed, but the caller was told
\* Failed" -- the late-fsync window that revision 14's P0 is about.
\*
\* Expected result: TLC violates LateFsyncUnreachable and prints a trace.
\*
\* If TLC does NOT find a violation here, the late-fsync split (StartAppend /
\* LandAfterAbandon / FailAppend-while-landed) is never actually exercised, the
\* extension is decorative, and every "no violation" result from the main config
\* is worth correspondingly less. This is the same self-test discipline the
\* buggy/abortedpresend controls apply to the design, applied to the MODEL.
\*
\* Cheap cross-check with the same purpose: run the main config with
\* `-coverage 1` and confirm LandAfterAbandon has a nonzero state count.
SPECIFICATION Spec

CONSTANTS
    RecoverAmbiguousCorrectly  = TRUE
    AbortedPreSendCompensation = FALSE
    MaxCrashes                 = 1
    MaxAppendFailures          = 1
    MaxLogLen                  = 9

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANT LateFsyncUnreachable

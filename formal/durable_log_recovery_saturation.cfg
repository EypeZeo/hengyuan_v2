\* SATURATION CHECK -- same design and same invariants as
\* durable_log_recovery.cfg, but at larger bounds. Not part of CI (it is ~5x
\* slower); run it by hand whenever the model changes.
\*
\* Purpose: a state-space bound that is too tight can hide violations and make a
\* "no error has been found" result meaningless. The check is to run the same
\* invariants at two bound levels and confirm (a) the state count actually grows,
\* proving the larger bound explores strictly more, and (b) the violation count
\* stays at zero. If violations ever appear only at the larger bound, the smaller
\* one was hiding them and the main config's bounds must be raised.
\*
\* Recorded results (2026-07-26, TLC 2.19):
\*   durable_log_recovery.cfg             Len<=9  Crashes=3 Fails=2
\*       -> 239,633 distinct states, 0 violations, depth 39
\*   durable_log_recovery_saturation.cfg  Len<=12 Crashes=4 Fails=3
\*       -> 527,876 distinct states, 0 violations, depth 40
\*   State count grew 2.2x; violations stayed at zero. Bounds are not masking.
SPECIFICATION Spec

CONSTANTS
    RecoverAmbiguousCorrectly  = TRUE
    AbortedPreSendCompensation = FALSE
    MaxCrashes                 = 4
    MaxAppendFailures          = 3
    MaxLogLen                  = 12

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoDoubleSend
    SendImpliesDurablePrepared
    TerminalIsStable
    FencedWriterMakesNoNewWrites
    OutcomeMatchesGroundTruth
    ExchangeOnlyHasSentOrders
    PendingWellFormed

\* ASSUMPTION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* ReconcileResolvesExisting = FALSE, liveness. An order the exchange HAS but reconciliation cannot match (a response that fails
\* validation) is refused by the tool too: v1 closes only orders that provably left no position. It stays unresolved. This is the
\* documented limit of the first version, not a defect of the protocol.
\* Expected: `Temporal properties were violated` (EventualSettlement, exit 13).
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE IN ANY OF THIS MODEL'S CONFIGS. !!!
\* Time is relative and saturating (see the model header), so the graph is finite without one -- and a constraint would
\* make the liveness runs unsound (durable_log_recovery_liveness.cfg explains why).
SPECIFICATION SpecLive

CONSTANTS
    ExclusiveOpen               = TRUE
    FenceFromLock               = TRUE
    FenceChecked                = TRUE
    LagAllowance                = TRUE
    ChecksExchange              = TRUE
    OperatorPathExists          = TRUE
    ReconcileResolvesExisting   = FALSE
    Window                      = 2
    Lag                         = 1
    MaxCrashes                  = 1
    MaxAborts                   = 1

CHECK_DEADLOCK FALSE

INVARIANT ClosedAbsentIsTrue

PROPERTY EventualSettlement

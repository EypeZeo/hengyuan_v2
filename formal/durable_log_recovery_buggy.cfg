\* REGRESSION CONTROL #1 -- NOT the current design.
\* Reintroduces the pre-revision-14 bug where recovery re-derives "Submitting"
\* (not "Ambiguous") from a Prepared-only durable frame, allowing a second Send
\* after crash+recover.
\*
\* Expected result: TLC finds a NoDoubleSend counterexample.
\* If this config ever stops finding a violation, the model has stopped being
\* discriminating and must not be trusted until fixed.
SPECIFICATION Spec

CONSTANTS
    RecoverAmbiguousCorrectly  = FALSE
    AbortedPreSendCompensation = FALSE
    MaxCrashes                 = 3
    MaxAppendFailures          = 2
    MaxLogLen                  = 9

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoDoubleSend

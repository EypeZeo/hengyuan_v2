\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* LagAllowance = FALSE.
\* The fence passed, but the evidence read is not required to be Lag ticks past it: a read that trails the exchange by Lag ticks reports
\* "absent" for a request accepted in the last moment of its window -- the order exists, the frame says it does not.
\*
\* Expected: `Invariant ClosedAbsentIsTrue is violated`.
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE IN ANY OF THIS MODEL'S CONFIGS. !!!
\* Time is relative and saturating (see the model header), so the graph is finite without one -- and a constraint would
\* make the liveness runs unsound (durable_log_recovery_liveness.cfg explains why).
SPECIFICATION Spec

CONSTANTS
    ExclusiveOpen               = TRUE
    FenceFromLock               = TRUE
    FenceChecked                = TRUE
    LagAllowance                = FALSE
    ChecksExchange              = TRUE
    OperatorPathExists          = TRUE
    ReconcileResolvesExisting   = TRUE
    Window                      = 2
    Lag                         = 1
    MaxCrashes                  = 1
    MaxAborts                   = 1

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ClosedAbsentIsTrue

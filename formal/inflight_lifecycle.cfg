\* Current design: no violation expected.
\*
\* Bounds chosen per the audit protocol's state-space guidance: prefer the
\* smallest counterexample, not the biggest model. 3 COIDs with 2 slots is
\* enough for capacity pressure to be reachable (so a leaked slot actually
\* starves a later submit) while keeping the graph small; the saturation
\* config raises both and must stay clean.

SPECIFICATION Spec

CONSTANTS
    COIDs               = {c1, c2, c3}
    MaxSlots            = 2
    MaxQueryAttempts    = 2
    TrackAcceptedOrders = TRUE

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoPhantomSlot
    NoLiveOrderIsUntracked
    TerminalOrderReleasesSlotOnceDrained
    SlotsWithinCapacity

\* REGRESSION CONTROL — THIS CONFIG MUST FAIL.
\*
\* ObserveFirst = FALSE: authorize() decides from the barrier's last view instead of refreshing it from the feed first. The stream can drop
\* between the loop's last observation and the decision; the token is issued on a barrier that still says Reconciled for a session that is gone.
\* (SubmitReadiness::authorize() reads the feed and observes BEFORE it decides, whether or not the loop ran a moment ago.)
\*
\* Expected: `Invariant TokensOnlyWhenReady is violated`.
\*
\* If this config ever stops failing, the model has stopped discriminating the property it exists for (see reconnect_sweep_bypass_fifo_bug.cfg).

SPECIFICATION Spec

CONSTANTS
    ORDERS           = {o1, o2}
    MaxGen           = 2
    MaxEpoch         = 4
    MaxDrops         = 1
    EvCap            = 3
    ReqCap           = 2
    TakeBeforeDrain  = TRUE
    MarkerInBand     = TRUE
    EpochChecked     = TRUE
    ObserveFirst     = FALSE
    DownOnDisconnect = TRUE

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReconciledIsSwept
    TokensOnlyWhenReady

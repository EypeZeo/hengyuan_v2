\* REACHABILITY PROBE -- THIS CONFIG MUST FAIL.
\*
\* Asserts SentWhileRevokedNeverHappens, a claim we WANT refuted: an order can be on the wire while a revocation is latched (claim first, revoke second: no recall).
\* If TLC cannot violate it, the main config's "no error" says nothing about that scenario.
\*
\* Expected: `Invariant SentWhileRevokedNeverHappens is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = TRUE
    ReconcileConcludesAbsent    = TRUE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    SentWhileRevokedNeverHappens

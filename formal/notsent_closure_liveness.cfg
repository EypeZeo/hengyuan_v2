\* LIVENESS run: every order is eventually settled -- closed by a durable Outcome or NotSent frame, or Dead (an
\* attempt that left no frame and so has nothing to close).
\*
\* Expected result: no EventualSettlement counterexample.
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE HERE. DO NOT ADD ONE. !!!
\* See durable_log_recovery_liveness.cfg: TLC's liveness checker runs on the constrained graph, and a state whose
\* successors were all pruned looks like a legal infinite stutter. Finiteness comes from action guards (the crash
\* and failure budgets, the Revoke latch, OutcomeLatched).
SPECIFICATION SpecLive

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = TRUE
    ReconcileConcludesAbsent    = TRUE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CHECK_DEADLOCK FALSE

INVARIANT NoDoubleSend

PROPERTY EventualSettlement

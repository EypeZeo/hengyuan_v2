\* Regression control #3: reintroduces the design REJECTED in Round D
\* review v5 -- release() with no owner-thread check, so any thread could
\* clear `held` (and, in the real code, close the handle) while the owner
\* is still using it. MUST violate NonOwnerReleaseNeverClearsHeld. If this
\* ever stops failing, the model has stopped discriminating the finding
\* that drove the atomic owner-thread-hash check in the shipped release().

SPECIFICATION Spec

CONSTANTS
    MaxCreateAttempts           = 3
    HandleRelativeIo            = TRUE
    HandleEncapsulated          = TRUE
    OwnerThreadCheckedOnRelease = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NonOwnerReleaseNeverClearsHeld

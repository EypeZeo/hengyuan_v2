\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* PessimisticExpiry = FALSE.
\* The raw clock reading is compared with the expiry. With a valid token the clock may still be Skew behind true time, so a
\* grant that has already expired is accepted.
\*
\* Expected: `Invariant NoClaimAfterExpiry is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = TRUE
    ChargeBeforeClaim       = TRUE
    RebuildFromLog          = TRUE
    ChargeHeldUntilResolved = TRUE
    ReplayGuard             = TRUE
    BindStore               = TRUE
    LatestWins              = TRUE
    RevokeAckAfterDurable   = TRUE
    KillInvalidatesScope    = TRUE
    AbsoluteExpiry          = TRUE
    RequireClockToken       = TRUE
    PessimisticExpiry       = FALSE
    MaxCrashes              = 2
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoClaimAfterExpiry

\* Current (shipped) design: no violation expected. All three model
\* switches at their real-design value.
\*
\* Full state space is finite by construction (8 booleans + createAttempts
\* bounded by MaxCreateAttempts) -- no CONSTRAINT needed, unlike this repo's
\* other models which track unbounded sequences.

SPECIFICATION Spec

CONSTANTS
    MaxCreateAttempts           = 3
    HandleRelativeIo            = TRUE
    HandleEncapsulated          = TRUE
    OwnerThreadCheckedOnRelease = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NeverWritesIntoWrongObject
    NoCapabilityUseAfterInvalidation
    NonOwnerReleaseNeverClearsHeld

PROPERTIES
    FenceIsSticky

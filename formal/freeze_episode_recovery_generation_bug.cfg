\* REGRESSION CONTROL #2 -- NOT the current design.
\* Reintroduces round-31/32's bug: a ConservativeWaitCompleted clear accepts
\* a WaitSatisfied bound to ANY generation <= the current one, not just an
\* exact match -- the legacy gen=0->1 upgrade path re-matching a stale
\* generation's evidence (docs/SPEC_INVARIANTS.md: "round 32 发现 legacy
\* gen=0→1 升级路径重新打开了这个漏洞").
\*
\* Expected result: TLC finds a WaitSatisfiedOnlyForCurrentGeneration
\* counterexample, along roughly: DetectFreeze -> ArmWait -> Land -> Ack
\* (armed.gen=0) -> WaitTick -> ClaimWaitSatisfied (gen=0, groundTruthOk=TRUE)
\* -> Land -> Ack (satisfied.gen=0) -> BumpGeneration (waitGeneration: 0->1)
\* -> ClearViaConservativeWaitCompleted (guard only requires satisfied.active,
\* generation match deferred to Ack) -> Land -> Ack (satisfied.gen=0 <=
\* waitGeneration=1 accepted under the buggy toggle) -> clearKind is now
\* ConservativeWaitCompleted while satisfied.gen (0) != waitGeneration (1).
\*
\* Needs MaxEpisodeEvents >= 2: one DetectFreeze + one BumpGeneration.
SPECIFICATION Spec

CONSTANTS
    SinkVerifiesWaitIndependently   = TRUE
    PromoteLegacyGenerationCorrectly = FALSE
    MaxCrashes                      = 1
    MaxAppendFailures               = 1
    MaxProbeTries                   = 1
    MaxEpisodeEvents                = 2

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    WaitSatisfiedOnlyForCurrentGeneration

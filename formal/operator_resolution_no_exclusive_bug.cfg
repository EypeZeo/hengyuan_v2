\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* ExclusiveOpen = FALSE.
\* The tool runs beside a live process (no exclusive open). The process prepares and sends an order after the tool has looked, or
\* while it is looking: the request is accepted AFTER the closing frame is written, for an order the log says does not exist.
\*
\* Expected: `Invariant ClosedAbsentIsTrue is violated`.
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE IN ANY OF THIS MODEL'S CONFIGS. !!!
\* Time is relative and saturating (see the model header), so the graph is finite without one -- and a constraint would
\* make the liveness runs unsound (durable_log_recovery_liveness.cfg explains why).
SPECIFICATION Spec

CONSTANTS
    ExclusiveOpen               = FALSE
    FenceFromLock               = TRUE
    FenceChecked                = TRUE
    LagAllowance                = TRUE
    ChecksExchange              = TRUE
    OperatorPathExists          = TRUE
    ReconcileResolvesExisting   = TRUE
    Window                      = 2
    Lag                         = 1
    MaxCrashes                  = 1
    MaxAborts                   = 1

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ClosedAbsentIsTrue

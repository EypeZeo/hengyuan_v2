\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* RevokeAckAfterDurable = FALSE.
\* The Owner is told "revoked" as soon as the executor has noted it in memory. A crash before the durable write loses it,
\* recovery brings the grant back, and an order is claimed after the Owner was told.
\*
\* Expected: `Invariant NoClaimAfterRevokeAck is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = TRUE
    ChargeBeforeClaim       = TRUE
    RebuildFromLog          = TRUE
    ChargeHeldUntilResolved = TRUE
    ReplayGuard             = TRUE
    BindStore               = TRUE
    LatestWins              = TRUE
    RevokeAckAfterDurable   = FALSE
    KillInvalidatesScope    = TRUE
    AbsoluteExpiry          = TRUE
    RequireClockToken       = TRUE
    PessimisticExpiry       = TRUE
    MaxCrashes              = 2
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoClaimAfterRevokeAck

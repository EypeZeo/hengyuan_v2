\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* RecoveryNeverClosesPrepared = FALSE.
\* Recovery reads "Prepared, nothing after it" as "probably never sent" and closes the order as NotSent.
\* Claim -> Send -> Crash -> Recover: an order that crossed is closed as if it had not.
\*
\* Expected: `Invariant ClosedNotSentIsTrue is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = FALSE
    RecoveryWaitsForWriter      = TRUE
    ReconcileConcludesAbsent    = TRUE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ClosedNotSentIsTrue

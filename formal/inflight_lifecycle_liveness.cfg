\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE HERE. DO NOT ADD ONE. !!!
\* See durable_log_recovery_liveness.cfg's own comment for the full reasoning:
\* TLC's liveness checker runs on the CONSTRAINED state graph, so a state whose
\* successors were all pruned by a constraint has no outgoing edges and TLC treats
\* stuttering there as a legal infinite behaviour -- reporting a spurious violation
\* (or, worse, hiding a real one).
\*
\* Finiteness here comes from the action guards instead: attempts is capped at
\* MaxQueryAttempts, every COID reaches a terminal or escalated state, and both
\* queues are drained by fair actions.

SPECIFICATION SpecLive

CONSTANTS
    COIDs               = {c1, c2}
    MaxSlots            = 2
    MaxQueryAttempts    = 2
    TrackAcceptedOrders = TRUE

CHECK_DEADLOCK FALSE

INVARIANT NoLiveOrderIsUntracked

PROPERTY EventualSlotRelease

\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* ChargeHeldUntilResolved = FALSE.
\* A "leak guard" gives back the charge of an order that recovered as Ambiguous after a while, with no proof that it never
\* crossed. Claim -> crash -> recover as Ambiguous -> the guard closes it: an order that crossed is closed as if it had not.
\*
\* Expected: `Invariant ClosedImpliesNeverCrossed is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = TRUE
    ChargeBeforeClaim       = TRUE
    RebuildFromLog          = TRUE
    ChargeHeldUntilResolved = FALSE
    ReplayGuard             = TRUE
    BindStore               = TRUE
    LatestWins              = TRUE
    RevokeAckAfterDurable   = TRUE
    KillInvalidatesScope    = TRUE
    AbsoluteExpiry          = TRUE
    RequireClockToken       = TRUE
    PessimisticExpiry       = TRUE
    MaxCrashes              = 2
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ClosedImpliesNeverCrossed

\* REACHABILITY PROBE -- this config is EXPECTED TO FAIL.
\*
\* AbandonedArmUnreachable is not an invariant of anything; it is a claim we
\* want TLC to REFUTE. armed.active alongside ~armedThisSession and
\* ~satisfied.active is the unique signature of "this session Armed, then
\* crashed before ever claiming WaitSatisfied" -- spec:2745's own "abandoned
\* across process restart" rule.
\*
\* Expected result: TLC violates AbandonedArmUnreachable and prints a trace.
\*
\* If TLC does NOT find a violation here, that rule is never actually
\* exercised by this model, and every "no violation" result from the main
\* config is worth correspondingly less. Same self-test discipline
\* durable_log_recovery_probe.cfg applies to the sibling model.
SPECIFICATION Spec

CONSTANTS
    SinkVerifiesWaitIndependently   = TRUE
    PromoteLegacyGenerationCorrectly = TRUE
    MaxCrashes                      = 1
    MaxAppendFailures               = 1
    MaxProbeTries                   = 1
    MaxEpisodeEvents                = 1

CHECK_DEADLOCK FALSE

INVARIANT AbandonedArmUnreachable

\* Current design (private-stream migration M3a/M3b): no violation expected.
\*
\* Two orders are enough for every ordering the claims rest on (one admitted before a request, one after; one resolved, one still live), two
\* generations and one lost event cover "new session" and "soft barrier", and the epoch bound lets a sweep be restarted a few times. The
\* five switches are all ON; each reconnect_sweep_*_bug.cfg turns exactly one OFF and MUST then fail.

SPECIFICATION Spec

CONSTANTS
    ORDERS           = {o1, o2}
    MaxGen           = 2
    MaxEpoch         = 4
    MaxDrops         = 1
    EvCap            = 3
    ReqCap           = 2
    TakeBeforeDrain  = TRUE
    MarkerInBand     = TRUE
    EpochChecked     = TRUE
    ObserveFirst     = TRUE
    DownOnDisconnect = TRUE

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReconciledIsSwept
    TokensOnlyWhenReady

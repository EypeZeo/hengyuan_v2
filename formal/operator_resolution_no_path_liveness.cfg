\* ASSUMPTION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* OperatorPathExists = FALSE: the tree today. Nothing can close an order the exchange never saw. The process degrades at every start,
\* the operator can only stop and restart it, and the order stays unresolved for ever.
\* Expected: `Temporal properties were violated` (EventualSettlement, exit 13).
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE IN ANY OF THIS MODEL'S CONFIGS. !!!
\* Time is relative and saturating (see the model header), so the graph is finite without one -- and a constraint would
\* make the liveness runs unsound (durable_log_recovery_liveness.cfg explains why).
SPECIFICATION SpecLive

CONSTANTS
    ExclusiveOpen               = TRUE
    FenceFromLock               = TRUE
    FenceChecked                = TRUE
    LagAllowance                = TRUE
    ChecksExchange              = TRUE
    OperatorPathExists          = FALSE
    ReconcileResolvesExisting   = TRUE
    Window                      = 2
    Lag                         = 1
    MaxCrashes                  = 1
    MaxAborts                   = 1

CHECK_DEADLOCK FALSE

INVARIANT ClosedAbsentIsTrue

PROPERTY EventualSettlement

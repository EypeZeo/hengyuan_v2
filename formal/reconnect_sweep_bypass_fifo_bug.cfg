\* REGRESSION CONTROL — THIS CONFIG MUST FAIL.
\*
\* MarkerInBand = FALSE: the SweepDone marker no longer travels in the same FIFO ring as the resolutions. It goes on a channel the hot thread can
\* read at any time, so the report can overtake a resolution the sweep produced before it. The barrier then becomes Reconciled while a fill the
\* sweep found is still in transit: the next order would be planned on a position that is not true. (This is why M3b put the marker in-band
\* instead of building a second report ring with a counter.)
\*
\* Expected: `Invariant ReconciledIsSwept is violated`.
\*
\* If this config ever stops failing, the model has stopped discriminating the property it exists for, and every "no violation" result from
\* reconnect_sweep.cfg is worth correspondingly less. Same inversion discipline as the other *_bug.cfg files and the TSan negative controls.

SPECIFICATION Spec

CONSTANTS
    ORDERS           = {o1, o2}
    MaxGen           = 2
    MaxEpoch         = 4
    MaxDrops         = 1
    EvCap            = 3
    ReqCap           = 2
    TakeBeforeDrain  = TRUE
    MarkerInBand     = FALSE
    EpochChecked     = TRUE
    ObserveFirst     = TRUE
    DownOnDisconnect = TRUE

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReconciledIsSwept
    TokensOnlyWhenReady

\* SATURATION run (manual only): the design config's invariants with larger budgets, to show the smaller bound is
\* not what keeps the model quiet. The state count must grow and the violations stay at zero. Re-run this pair
\* whenever the model changes.
SPECIFICATION Spec

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = TRUE
    ReconcileConcludesAbsent    = TRUE
    MaxCrashes                  = 3
    MaxAppendFailures           = 2
    MaxLogLen                   = 9

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoDoubleSend
    SendImpliesDurablePrepared
    NotSentImpliesNeverCrossed
    ClosedNotSentIsTrue
    ClosedNotSentIsDurable
    ReleaseNeedsProof
    NoClaimUnderRevoke
    SendRequiresClaim
    ClaimRejectExclusive
    ReplayLegal
    TerminalIsStable
    FencedWriterMakesNoNewWrites
    OutcomeMatchesGroundTruth
    ExchangeOnlyHasSentOrders
    PendingWellFormed

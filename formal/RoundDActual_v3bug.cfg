\* Regression control #1: reintroduces the design REJECTED in Round D
\* review v3 -- path-based (not handle-relative) I/O, which cannot detect
\* "the object I'm about to open by path is not the one I checked a moment
\* ago". MUST violate NeverWritesIntoWrongObject. If this ever stops
\* failing, the model has stopped discriminating the TOCTOU finding that
\* drove the entire v4+ handle-relative redesign.

SPECIFICATION Spec

CONSTANTS
    MaxCreateAttempts           = 3
    HandleRelativeIo            = FALSE
    HandleEncapsulated          = TRUE
    OwnerThreadCheckedOnRelease = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NeverWritesIntoWrongObject

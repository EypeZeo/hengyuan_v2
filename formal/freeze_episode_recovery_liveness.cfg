\* LIVENESS run: any active freeze episode eventually resolves.
\*
\* Expected result: no EventualFreezeResolution counterexample.
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE HERE. DO NOT ADD ONE. !!!
\* See durable_log_recovery_liveness.cfg's own comment for why: TLC's
\* liveness checker runs on the CONSTRAINED state graph, and a state whose
\* successors were all pruned by a constraint has no outgoing edges, making
\* TLC report stuttering there as a legal infinite behavior -- a false
\* counterexample. Finiteness here comes entirely from action guards tied to
\* budgets (crashesLeft/failsLeft/probeTriesLeft/episodeEventsLeft), which is
\* also why this model never needed a StateConstraint at all, unlike
\* durable_log_recovery.tla's unboundedly-growing append-only log.
SPECIFICATION SpecLive

CONSTANTS
    SinkVerifiesWaitIndependently   = TRUE
    PromoteLegacyGenerationCorrectly = TRUE
    MaxCrashes                      = 2
    MaxAppendFailures               = 1
    MaxProbeTries                   = 3
    MaxEpisodeEvents                = 2

CHECK_DEADLOCK FALSE

INVARIANT ProbeAttemptsNeverExceedCap

PROPERTY EventualFreezeResolution

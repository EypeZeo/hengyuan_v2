\* REGRESSION CONTROL #2 -- NOT the current design.
\* Reintroduces revision-13's `AbortedPreSend` compensation: treating a Failed
\* durable append as PROOF that the operation did not happen, and releasing the
\* order's registration on that basis. The spec's revision-14 P0 removed it:
\*
\*   "a `Failed` append may still have completed physically. The old
\*    compensation called that case `AbortedPreSend`; fixed by removing that
\*    unsafe claim."
\*
\* Expected result: TLC finds a NoDoubleSend counterexample, along roughly:
\*   StartPrepared -> Land -> Ack -> Send -> StartOutcome -> FailAppend(releases)
\*   -> LoseAfterAbandon -> StartPrepared -> Land -> Ack -> Send   [sendCount = 2]
\*
\* Note it needs NO crash at all -- MaxCrashes = 1 is already generous. This is
\* the config that makes the writer fence LOAD-BEARING rather than decorative:
\* with AbortedPreSendCompensation = FALSE the fence is what blocks that second
\* Send, and nothing else in the model discriminates it.
SPECIFICATION Spec

CONSTANTS
    RecoverAmbiguousCorrectly  = TRUE
    AbortedPreSendCompensation = TRUE
    MaxCrashes                 = 1
    MaxAppendFailures          = 1
    MaxLogLen                  = 9

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoDoubleSend
    SendImpliesDurablePrepared

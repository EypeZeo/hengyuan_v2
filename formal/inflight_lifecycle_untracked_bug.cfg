\* REGRESSION CONTROL — THIS CONFIG MUST FAIL.
\*
\* TrackAcceptedOrders = FALSE reinstates the pre-audit behaviour: an order the
\* exchange ACCEPTED keeps its InFlightRegistry slot but is never pushed to
\* ToReconcileRing, so nothing can ever discover that it filled or was cancelled.
\* poll_once() only ever sees what arrives on that ring, so the order is stranded
\* holding a slot forever -- and drain_reconcile_events() correctly refuses to
\* release a slot for anything that is not exchange-final.
\*
\* Expected: `Invariant NoLiveOrderIsUntracked is violated`.
\*
\* If this config ever stops failing, the model has stopped discriminating the
\* defect it was written for, and every "no violation" result from
\* inflight_lifecycle.cfg is worth correspondingly less. Same inversion discipline
\* as durable_log_recovery_buggy.cfg and the TSan negative controls.

SPECIFICATION Spec

CONSTANTS
    COIDs               = {c1, c2, c3}
    MaxSlots            = 2
    MaxQueryAttempts    = 2
    TrackAcceptedOrders = FALSE

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoPhantomSlot
    NoLiveOrderIsUntracked
    TerminalOrderReleasesSlotOnceDrained
    SlotsWithinCapacity

\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* RecoveryWaitsForWriter = FALSE.
\* The successor's recovery scan does not wait for the predecessor's last write. A NotSent that lands late, after
\* the successor recovered the order as Ambiguous and reconciled it, leaves [Prepared, NotSent, Outcome] -- a
\* sequence replay cannot accept. This is not a defect of the protocol but the ASSUMPTION it rests on: the
\* exclusive log open (no-sharing CreateFileA / flock LOCK_EX in durable_log_store.hpp) means the successor scans only after the predecessor's handle is gone.
\* The safety invariants still hold in this run (see notsent_closure_no_lock_safety.cfg); only ReplayLegal
\* depends on it.
\*
\* Expected: `Invariant ReplayLegal is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = FALSE
    ReconcileConcludesAbsent    = TRUE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReplayLegal

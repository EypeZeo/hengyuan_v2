\* ASSUMPTION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* ReconcileConcludesAbsent = FALSE, liveness. An order whose Prepared frame is the last durable frame and which the
\* exchange never saw (a crash between the Prepared ACK and the send, or a NotSent append that was lost) stays Ambiguous
\* for ever: reconciliation cannot close it. In the tree that order is escalated to the operator by the R-10 quarantine
\* and counted as unresolved for the life of the process (blueprint L-46). This is why a NotSent frame is worth having,
\* and what the loss of one costs.
\*
\* Expected: `Temporal properties were violated` (EventualSettlement).
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE HERE. DO NOT ADD ONE. !!!
SPECIFICATION SpecLive

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = TRUE
    ReconcileConcludesAbsent    = FALSE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CHECK_DEADLOCK FALSE

INVARIANT NoDoubleSend

PROPERTY EventualSettlement

\* Correct (spec revision 73) design, safety run.
\* Expected result: TLC finds ZERO invariant violations.
\*
\* CHECK_DEADLOCK FALSE is required, not cosmetic: Crash is now guarded by a
\* budget, so legitimate terminal states exist (all COIDs resolved, no budget
\* left) and TLC would otherwise report them as deadlocks. Nothing is lost --
\* durable_log_recovery_liveness.cfg's EventualResolution is strictly stronger
\* than deadlock-freedom: it says the terminal state is a RESOLVED one, not
\* merely that one exists.
SPECIFICATION Spec

CONSTANTS
    RecoverAmbiguousCorrectly  = TRUE
    AbortedPreSendCompensation = FALSE
    MaxCrashes                 = 3
    MaxAppendFailures          = 2
    MaxLogLen                  = 9

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoDoubleSend
    SendImpliesDurablePrepared
    TerminalIsStable
    FencedWriterMakesNoNewWrites
    OutcomeMatchesGroundTruth
    ExchangeOnlyHasSentOrders
    PendingWellFormed

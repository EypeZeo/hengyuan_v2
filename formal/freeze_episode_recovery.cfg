\* Correct design, safety run.
\* Expected result: TLC finds ZERO invariant violations.
\*
\* CHECK_DEADLOCK FALSE is required, not cosmetic: DetectFreeze/BumpGeneration/
\* StartProbeAttempt/Crash/FailAppend are all guarded by budgets, so legitimate
\* terminal states exist (all budgets exhausted, episode resolved) and TLC
\* would otherwise report them as deadlocks.
SPECIFICATION Spec

CONSTANTS
    SinkVerifiesWaitIndependently   = TRUE
    PromoteLegacyGenerationCorrectly = TRUE
    MaxCrashes                      = 2
    MaxAppendFailures               = 2
    MaxProbeTries                   = 9
    MaxEpisodeEvents                = 3

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ProbeAttemptsNeverExceedCap
    NoPrematureConservativeClear
    WaitSatisfiedOnlyForCurrentGeneration
    PermanentLatchOnlyOperatorClear

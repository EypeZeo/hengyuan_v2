\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* SingleAttemptCoid = FALSE.
\* A closed order goes back to Intent and is prepared and sent again under the SAME client-order-id, behind its own
\* NotSent frame. Reject -> NotSent acked -> Prepared -> Claim -> Send: a durable NotSent for an order that crossed.
\* (ReplayLegal breaks one step earlier, when the second Prepared lands behind the NotSent.)
\*
\* Expected: `Invariant NotSentImpliesNeverCrossed is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = FALSE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = TRUE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NotSentImpliesNeverCrossed

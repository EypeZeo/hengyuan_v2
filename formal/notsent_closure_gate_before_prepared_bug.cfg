\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* FinalGateAfterPrepared = FALSE.
\* The claim can be taken before the Prepared frame is ACKed (the gate is in the wrong place). Claim -> Send with
\* no durable Prepared frame.
\*
\* Expected: `Invariant SendImpliesDurablePrepared is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = FALSE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = TRUE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    SendImpliesDurablePrepared

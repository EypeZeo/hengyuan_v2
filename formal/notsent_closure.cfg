\* The design of docs/NOTSENT_CLOSURE_DESIGN.md: every switch on, safety run.
\* Expected result: TLC finds ZERO invariant violations.
\*
\* CHECK_DEADLOCK FALSE is required, not cosmetic: Crash and FailAppend are budgeted, so legitimate terminal
\* states exist and TLC would otherwise report them as deadlocks. notsent_closure_liveness.cfg's
\* EventualSettlement is strictly stronger than deadlock-freedom.
SPECIFICATION Spec

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = TRUE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = TRUE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoDoubleSend
    SendImpliesDurablePrepared
    NotSentImpliesNeverCrossed
    ClosedNotSentIsTrue
    ClosedNotSentIsDurable
    ReleaseNeedsProof
    NoClaimUnderRevoke
    SendRequiresClaim
    ClaimRejectExclusive
    ReplayLegal
    TerminalIsStable
    FencedWriterMakesNoNewWrites
    OutcomeMatchesGroundTruth
    ExchangeOnlyHasSentOrders
    PendingWellFormed

\* Bound-saturation check, manual only (not wired into CI -- it is several times
\* slower than the main config for the same verdict).
\*
\* Guards against a too-tight bound giving false confidence: if the main config's
\* smaller bounds were masking a violation, raising them would surface it. Run this
\* pair whenever the model changes and record both state counts in formal/README.md,
\* same discipline as durable_log_recovery_saturation.cfg.

SPECIFICATION Spec

\* One more COID and one more retry than the main config. Deliberately NOT also
\* raising MaxSlots: 4 COIDs x 3 slots x 3 attempts pushes this past 50M distinct
\* states, which buys no additional discrimination -- the counterexample the
\* regression control finds is 2 states deep, so a bound that large is testing the
\* model checker rather than the design.
CONSTANTS
    COIDs               = {c1, c2, c3, c4}
    MaxSlots            = 2
    MaxQueryAttempts    = 3
    TrackAcceptedOrders = TRUE

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoPhantomSlot
    NoLiveOrderIsUntracked
    TerminalOrderReleasesSlotOnceDrained
    SlotsWithinCapacity

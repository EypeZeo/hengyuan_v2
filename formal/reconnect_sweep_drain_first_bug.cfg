\* REGRESSION CONTROL — THIS CONFIG MUST FAIL.
\*
\* TakeBeforeDrain = FALSE: poll_once() drains the ingress ring BEFORE it takes the sweep request. An order the hot thread sent after that drain
\* but before it posted the request is in the request's bound and is nowhere in the tracker when the sweep runs: the sweep answers for the orders
\* it knows, pushes its marker, and the barrier is Reconciled with an order that was never asked about. Taking the request first guarantees the
\* orders that preceded it are already in the ring when the ring is drained.
\*
\* Expected: `Invariant ReconciledIsSwept is violated`.
\*
\* If this config ever stops failing, the model has stopped discriminating the property it exists for (see reconnect_sweep_bypass_fifo_bug.cfg).

SPECIFICATION Spec

CONSTANTS
    ORDERS           = {o1, o2}
    MaxGen           = 2
    MaxEpoch         = 4
    MaxDrops         = 1
    EvCap            = 3
    ReqCap           = 2
    TakeBeforeDrain  = FALSE
    MarkerInBand     = TRUE
    EpochChecked     = TRUE
    ObserveFirst     = TRUE
    DownOnDisconnect = TRUE

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReconciledIsSwept
    TokensOnlyWhenReady

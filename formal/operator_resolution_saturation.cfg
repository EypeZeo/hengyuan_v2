\* SATURATION run (manual only): the design config with a wider acceptance window, a longer read lag and a second crash, to show the
\* small bounds are not what keeps the model quiet. The state count must grow and the violations stay at zero.
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE IN ANY OF THIS MODEL'S CONFIGS. !!!
\* Time is relative and saturating (see the model header), so the graph is finite without one -- and a constraint would
\* make the liveness runs unsound (durable_log_recovery_liveness.cfg explains why).
SPECIFICATION Spec

CONSTANTS
    ExclusiveOpen               = TRUE
    FenceFromLock               = TRUE
    FenceChecked                = TRUE
    LagAllowance                = TRUE
    ChecksExchange              = TRUE
    OperatorPathExists          = TRUE
    ReconcileResolvesExisting   = TRUE
    Window                      = 3
    Lag                         = 2
    MaxCrashes                  = 2
    MaxAborts                   = 2

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ClosedAbsentIsTrue
    ReplayLegal
    ExclusiveHolds
    DeliveredOnlyIfSent
    SentOnlyIfPrepared
    OutcomeOnlyIfDelivered

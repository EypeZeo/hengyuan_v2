\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* ReplayGuard = FALSE.
\* Any validly signed grant installs, whatever its serial: the artifact the Owner revoked (he was told) is presented again
\* and is live again.
\*
\* Expected: `Invariant NoClaimAfterRevokeAck is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = TRUE
    ChargeBeforeClaim       = TRUE
    RebuildFromLog          = TRUE
    ChargeHeldUntilResolved = TRUE
    ReplayGuard             = FALSE
    BindStore               = TRUE
    LatestWins              = TRUE
    RevokeAckAfterDurable   = TRUE
    KillInvalidatesScope    = TRUE
    AbsoluteExpiry          = TRUE
    RequireClockToken       = TRUE
    PessimisticExpiry       = TRUE
    MaxCrashes              = 2
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoClaimAfterRevokeAck

\* Current design, liveness check: a held lease always eventually resolves
\* (written, fenced, or released) -- it never gets stuck with nothing able
\* to make progress. No CONSTRAINT here (see formal/README.md's own
\* liveness-config trap #1 for durable_log_recovery.tla -- the same reason
\* applies here even though this model's state space is already finite
\* without one): finiteness comes from createAttempts being guard-bounded,
\* not from a CONSTRAINT clause.

SPECIFICATION SpecLive

CONSTANTS
    MaxCreateAttempts           = 3
    HandleRelativeIo            = TRUE
    HandleEncapsulated          = TRUE
    OwnerThreadCheckedOnRelease = TRUE

CHECK_DEADLOCK FALSE

PROPERTIES
    EventualResolution

\* REGRESSION CONTROL #3 -- THIS CONFIG MUST FAIL.
\*
\* CheckFirstBridge = FALSE reinstates the bridge-check-disabled bug:
\* apply_snapshot() enters Tracking without verifying U <= lastUpdateId+1
\* on the first kept event. A first kept event whose window starts beyond
\* lastUpdateId+1 means updates (lastUpdateId+1 .. U-1) are missing between
\* the snapshot and the stream -- the book would be built on a gap. The real
\* code rejects the snapshot attempt and resyncs instead
\* (depth_manager.hpp:181-189, test ResyncOnGapInBufferedEvents).
\*
\* Expected: `Invariant FirstBridgeConstraint is violated`.
\*
\* If this config ever stops failing, the model has stopped discriminating
\* the bridge check and every "no violation" result from
\* depth_snapshot_bootstrap.cfg is worth less.
SPECIFICATION Spec

CONSTANTS
    MaxSeq                  = 5
    MaxBufferLen            = 3
    MaxDeliveries           = 6
    BufferEventsInBuffering = TRUE
    RejectSnapshotOnOverflow = TRUE
    CheckFirstBridge        = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoOverflowThenTracking
    StaleIncrementsDropped
    FirstBridgeConstraint
    TrackingGapForcesRebuffer
    SequenceAlwaysConsumedOnRejection
    TrackingImpliesBookConsistent

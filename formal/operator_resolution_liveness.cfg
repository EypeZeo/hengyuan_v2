\* LIVENESS run: every prepared order is eventually closed -- by reconciliation (the exchange has it) or by the operator's tool (it
\* provably does not) -- given a fair operator and a fair reconcile.
\* Expected result: no EventualSettlement counterexample.
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE IN ANY OF THIS MODEL'S CONFIGS. !!!
\* Time is relative and saturating (see the model header), so the graph is finite without one -- and a constraint would
\* make the liveness runs unsound (durable_log_recovery_liveness.cfg explains why).
SPECIFICATION SpecLive

CONSTANTS
    ExclusiveOpen               = TRUE
    FenceFromLock               = TRUE
    FenceChecked                = TRUE
    LagAllowance                = TRUE
    ChecksExchange              = TRUE
    OperatorPathExists          = TRUE
    ReconcileResolvesExisting   = TRUE
    Window                      = 2
    Lag                         = 1
    MaxCrashes                  = 1
    MaxAborts                   = 1

CHECK_DEADLOCK FALSE

INVARIANT ClosedAbsentIsTrue

PROPERTY EventualSettlement

\* The design of docs/OPERATOR_RESOLUTION_DESIGN.md: every switch on, safety run.
\* Expected result: TLC finds ZERO invariant violations.
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE IN ANY OF THIS MODEL'S CONFIGS. !!!
\* Time is relative and saturating (see the model header), so the graph is finite without one -- and a constraint would
\* make the liveness runs unsound (durable_log_recovery_liveness.cfg explains why).
SPECIFICATION Spec

CONSTANTS
    ExclusiveOpen               = TRUE
    FenceFromLock               = TRUE
    FenceChecked                = TRUE
    LagAllowance                = TRUE
    ChecksExchange              = TRUE
    OperatorPathExists          = TRUE
    ReconcileResolvesExisting   = TRUE
    Window                      = 2
    Lag                         = 1
    MaxCrashes                  = 1
    MaxAborts                   = 1

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ClosedAbsentIsTrue
    ReplayLegal
    ExclusiveHolds
    DeliveredOnlyIfSent
    SentOnlyIfPrepared
    OutcomeOnlyIfDelivered

\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* ChargeBeforeClaim = FALSE.
\* The charge against the grant is appended after the send, not carried by the Prepared frame. Claim -> send -> crash
\* before the charge lands -> recovery rebuilds the used budget from the durable charges and finds none -> a second order
\* is admitted: two orders may have crossed under a budget of one.
\*
\* Expected: `Invariant BudgetNeverExceeded is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = TRUE
    ChargeBeforeClaim       = FALSE
    RebuildFromLog          = TRUE
    ChargeHeldUntilResolved = TRUE
    ReplayGuard             = TRUE
    BindStore               = TRUE
    LatestWins              = TRUE
    RevokeAckAfterDurable   = TRUE
    KillInvalidatesScope    = TRUE
    AbsoluteExpiry          = TRUE
    RequireClockToken       = TRUE
    PessimisticExpiry       = TRUE
    MaxCrashes              = 2
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    BudgetNeverExceeded

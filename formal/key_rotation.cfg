\* Current (correct) design, safety run. Expected result: TLC finds ZERO
\* invariant violations.
\*
\* No CONSTRAINT line: the state space is finite by construction (every
\* variable has a finite domain; crashes_left is bounded by an action guard).
\* RoundDActual.cfg is the precedent for a model that needs no constraint.
\*
\* CHECK_DEADLOCK FALSE is required, not cosmetic: Crash is budget-guarded,
\* so legitimate terminal states exist (crash budget exhausted, rotation
\* done, sink fenced, ...) and TLC would otherwise report them as
\* deadlocks. Nothing is lost -- the liveness config's
\* EventualConsistencyOrFenced is strictly stronger than deadlock-freedom.
\*
\* MaxCrashes = 2 is enough to exercise every crash cut (a crash can land
\* in any Running state) while keeping the graph small; the repair branch is
\* reachable in two crashes (crash mid-rotation, then recover). This model
\* is tiny by construction, so bumping it costs little.
SPECIFICATION Spec

CONSTANTS
    MaxCrashes           = 2
    RepairOnlyWhenProven = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    AnchorImpliesNonEmptyLog
    RepairOnlyOnProvenMismatch
    NoDataUnverifiableAfterRotation
    IoFailureFencesRotationOrSink
    FlipOnlyAfterStepsDurable

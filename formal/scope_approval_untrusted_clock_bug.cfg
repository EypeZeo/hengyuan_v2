\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* RequireClockToken = FALSE.
\* The expiry check uses whatever the local clock shows even when the clock token is invalid (a rolled-back or unsynced
\* clock): an expired grant looks valid and an order is claimed under it.
\*
\* Expected: `Invariant NoClaimAfterExpiry is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = TRUE
    ChargeBeforeClaim       = TRUE
    RebuildFromLog          = TRUE
    ChargeHeldUntilResolved = TRUE
    ReplayGuard             = TRUE
    BindStore               = TRUE
    LatestWins              = TRUE
    RevokeAckAfterDurable   = TRUE
    KillInvalidatesScope    = TRUE
    AbsoluteExpiry          = TRUE
    RequireClockToken       = FALSE
    PessimisticExpiry       = TRUE
    MaxCrashes              = 2
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoClaimAfterExpiry

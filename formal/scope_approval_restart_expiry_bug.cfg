\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* AbsoluteExpiry = FALSE.
\* The executor turns the expiry into "valid for N", counted from when it installs the grant (and again after every
\* restart), instead of keeping the instant the Owner signed. A grant installed late, or a restart close to the real expiry,
\* gives it a new lease, and an order is claimed after the instant the Owner signed.
\*
\* Expected: `Invariant NoClaimAfterExpiry is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = TRUE
    ChargeBeforeClaim       = TRUE
    RebuildFromLog          = TRUE
    ChargeHeldUntilResolved = TRUE
    ReplayGuard             = TRUE
    BindStore               = TRUE
    LatestWins              = TRUE
    RevokeAckAfterDurable   = TRUE
    KillInvalidatesScope    = TRUE
    AbsoluteExpiry          = FALSE
    RequireClockToken       = TRUE
    PessimisticExpiry       = TRUE
    MaxCrashes              = 2
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoClaimAfterExpiry

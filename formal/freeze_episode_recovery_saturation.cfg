\* SATURATION CHECK -- same design and same invariants as
\* freeze_episode_recovery.cfg, but at larger bounds. Not part of CI; run by
\* hand whenever the model changes.
\*
\* Purpose: confirm (a) the state count actually grows at the larger bound,
\* proving it explores strictly more, and (b) the violation count stays at
\* zero. If violations only appear at the larger bound, the smaller one was
\* hiding them and the main config's bounds must be raised.
\*
\* Recorded results (2026-08-01, TLC 2.19):
\*   freeze_episode_recovery.cfg              Crashes=2 Fails=2 Probes=9  Episodes=3
\*       -> 4,995,065 distinct states, 0 violations, depth 61
\*   freeze_episode_recovery_saturation.cfg   Crashes=3 Fails=2 Probes=9  Episodes=3
\*       -> 6,978,870 distinct states, 0 violations, depth 61
\*   State count grew 1.4x; violations stayed at zero.
\*
\* Bumps only MaxCrashes (2->3), not every budget simultaneously -- an
\* earlier attempt at Crashes=3/Fails=3/Probes=10/Episodes=4 was still
\* growing past 17M states after 4 minutes with no end in sight (each of the
\* 4 independent budgets multiplies the reachable combinations, unlike
\* durable_log_recovery.tla's saturation check, which only has 2 independent
\* budgets to begin with). One budget at a time keeps this tractable while
\* still proving the state count grows and violations stay at zero.
SPECIFICATION Spec

CONSTANTS
    SinkVerifiesWaitIndependently   = TRUE
    PromoteLegacyGenerationCorrectly = TRUE
    MaxCrashes                      = 3
    MaxAppendFailures               = 2
    MaxProbeTries                   = 9
    MaxEpisodeEvents                = 3

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ProbeAttemptsNeverExceedCap
    NoPrematureConservativeClear
    WaitSatisfiedOnlyForCurrentGeneration
    PermanentLatchOnlyOperatorClear

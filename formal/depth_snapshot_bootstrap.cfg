\* Current (correct) design, safety run. Expected result: TLC finds ZERO
\* invariant violations.
\*
\* No CONSTRAINT line: the state space is finite by construction
\* (deliveries_left is a bounded action guard, the buffer is length-bounded,
\* and every other variable has a finite domain). RoundDActual.cfg is the
\* precedent for a model that needs no constraint.
\*
\* CHECK_DEADLOCK FALSE is required, not cosmetic: the delivery budget is
\* guarded, so legitimate terminal states exist (budget exhausted while
\* Tracking) and TLC would otherwise report them as deadlocks. Nothing is
\* lost -- the liveness config's EventualBootstrap is strictly stronger
\* than deadlock-freedom.
\*
\* Bounds: MaxSeq=5 (update ids 1..5), MaxBufferLen=3 (kMaxBuffered=4096,
\* scaled down), MaxDeliveries=6. Small enough to keep the graph fast,
\* large enough for overflow to be reachable (needs MaxBufferLen+1
\* deliveries) and for multi-event buffers to exercise the replay.
SPECIFICATION Spec

CONSTANTS
    MaxSeq                  = 5
    MaxBufferLen            = 3
    MaxDeliveries           = 6
    BufferEventsInBuffering = TRUE
    RejectSnapshotOnOverflow = TRUE
    CheckFirstBridge        = TRUE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoOverflowThenTracking
    StaleIncrementsDropped
    FirstBridgeConstraint
    TrackingGapForcesRebuffer
    SequenceAlwaysConsumedOnRejection
    TrackingImpliesBookConsistent

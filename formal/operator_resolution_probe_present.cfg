\* REACHABILITY PROBE -- THIS CONFIG MUST FAIL.
\*
\* Asserts PresentVerdictNeverHappens, a claim we WANT refuted: the tool can face an order the exchange has and say so.
\* If TLC cannot violate it, the main config's "no error" says nothing about that scenario.
\*
\* Expected: `Invariant PresentVerdictNeverHappens is violated`.
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE IN ANY OF THIS MODEL'S CONFIGS. !!!
\* Time is relative and saturating (see the model header), so the graph is finite without one -- and a constraint would
\* make the liveness runs unsound (durable_log_recovery_liveness.cfg explains why).
SPECIFICATION Spec

CONSTANTS
    ExclusiveOpen               = TRUE
    FenceFromLock               = TRUE
    FenceChecked                = TRUE
    LagAllowance                = TRUE
    ChecksExchange              = TRUE
    OperatorPathExists          = TRUE
    ReconcileResolvesExisting   = TRUE
    Window                      = 2
    Lag                         = 1
    MaxCrashes                  = 1
    MaxAborts                   = 1

CHECK_DEADLOCK FALSE

INVARIANTS
    PresentVerdictNeverHappens

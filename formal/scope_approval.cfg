\* The design of docs/SCOPE_APPROVAL_DESIGN.md: every switch on, safety run.
\* Expected result: TLC finds ZERO invariant violations.
\*
\* CHECK_DEADLOCK FALSE is required, not cosmetic: Crash, Wipe, ClockFault and Kill are budgeted and time stops at
\* MaxT, so legitimate terminal states exist and TLC would otherwise report them as deadlocks. No liveness is claimed
\* (a system that refuses everything satisfies every invariant here; the probes show the interesting scenarios are
\* reachable).
SPECIFICATION Spec

CONSTANTS
    AtomicScopeClaim        = TRUE
    ChargeBeforeClaim       = TRUE
    RebuildFromLog          = TRUE
    ChargeHeldUntilResolved = TRUE
    ReplayGuard             = TRUE
    BindStore               = TRUE
    LatestWins              = TRUE
    RevokeAckAfterDurable   = TRUE
    KillInvalidatesScope    = TRUE
    AbsoluteExpiry          = TRUE
    RequireClockToken       = TRUE
    PessimisticExpiry       = TRUE
    MaxCrashes              = 1
    MaxWipes                = 1
    MaxClockFaults          = 1
    MaxKills                = 1

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    BudgetNeverExceeded
    NoClaimAfterRevokeAck
    NoClaimUnderSuperseded
    NoClaimUnderKilledScope
    NoClaimAfterExpiry
    NoClaimWhileKilled
    LiveGrantsAreSigned
    CrossedImpliesDurableCharge
    ClosedImpliesNeverCrossed
    MemoryCountsMatchOrders
    HWMCoversStatuses

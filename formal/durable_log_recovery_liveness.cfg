\* LIVENESS run: every order eventually reaches a durably-recorded outcome.
\*
\* The spec has a documented history of self-lock / deadlock defects -- "PostSeal
\* journal-full deadlock" (r37), "Started v1->v2 migration deadlock" (r56),
\* "ClrUnauthorized self-lock" (r59), "FreezeProbeCredit 8-attempt self-lock"
\* (r24) -- so a progress property is worth as much here as a safety one.
\*
\* Expected result: no EventualResolution counterexample.
\*
\* !!! THERE IS DELIBERATELY NO `CONSTRAINT` LINE HERE. DO NOT ADD ONE. !!!
\* TLC's liveness checker runs on the CONSTRAINED state graph. A state whose
\* successors were all pruned by a constraint has no outgoing edges, so TLC
\* treats stuttering there as a legal infinite behavior and reports
\* <>Resolved(c) as violated -- a false counterexample that looks exactly like a
\* real deadlock. Finiteness here comes instead from ACTION GUARDS: MaxCrashes
\* and MaxAppendFailures bound Crash and FailAppend, and OutcomeLatched bounds
\* NetworkDeliver. That is why those budgets are modeled as guarded variables
\* rather than as constraint clauses.
SPECIFICATION SpecLive

CONSTANTS
    RecoverAmbiguousCorrectly  = TRUE
    AbortedPreSendCompensation = FALSE
    MaxCrashes                 = 2
    MaxAppendFailures          = 1
    \* Declared because the module declares it, but UNUSED here: this config has
    \* no CONSTRAINT line, so StateConstraint (the only reader of MaxLogLen) is
    \* never evaluated. Finiteness comes from the action guards instead.
    MaxLogLen                  = 9

CHECK_DEADLOCK FALSE

INVARIANT NoDoubleSend

PROPERTY EventualResolution

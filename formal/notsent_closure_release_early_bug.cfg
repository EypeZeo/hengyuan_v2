\* REGRESSION CONTROL -- THIS CONFIG MUST FAIL.
\*
\* ReleaseAfterAck = FALSE.
\* The order's resources are released when the NotSent append is issued, not when it is ACKed (or recovered).
\*
\* Expected: `Invariant ReleaseNeedsProof is violated`.
SPECIFICATION Spec

CONSTANTS
    AtomicClaim                 = TRUE
    ExclusiveDecision           = TRUE
    FinalGateAfterPrepared      = TRUE
    NoCompensationOnFailure     = TRUE
    ReleaseAfterAck             = FALSE
    SingleAttemptCoid           = TRUE
    RecoveryNeverClosesPrepared = TRUE
    RecoveryWaitsForWriter      = TRUE
    MaxCrashes                  = 2
    MaxAppendFailures           = 1
    MaxLogLen                   = 7

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReleaseNeedsProof

[project]
name = "py_core"
version = "0.1.0"
description = "HengYuan v2 — reusable research/backtest utilities (no live execution, no risk gate, no exchange adapter)."
requires-python = ">=3.13"
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=2.1,<3.0",
  "pyarrow>=25.0,<26.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=7.1,<8.0",
]

[tool.setuptools]
# risk/, backtests/ live directly under this pyproject.toml's directory (no
# src/ layout), so setuptools' automatic package discovery sees them as
# separate top-level packages and refuses to build. Map "py_core" explicitly
# onto "." so `import py_core.manual_ohlcv` etc. resolves as intended.
package-dir = {"py_core" = "."}
packages = ["py_core", "py_core.backtests", "py_core.risk", "py_core.market_data", "py_core.research", "py_core.validation", "py_core.indicators", "py_core.strategies", "py_core.strategy_spec", "py_core.tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# AUDIT PYCI-WARN-047: previously no filterwarnings config at all, so a RuntimeWarning
# from invalid/degenerate floating-point arithmetic (divide-by-zero, invalid-value) could
# in principle be silently swallowed while the suite still reported green -- the
# statistical-layer analogue of TEST-GAP-RISK-035 ("sanitizer green != actually verified").
# Verified empirically before adding this (self-falsified the original premise: at audit
# time, `-W error::RuntimeWarning` already produced the same 667 passed / 2 skipped result
# -- there were zero warnings being swallowed, only the missing gate itself). Promoting
# that ad-hoc flag to a permanent config closes the gate so a *future* regression that
# introduces a swallowed warning fails loudly instead of passing silently.
filterwarnings = ["error::RuntimeWarning"]

# Coverage gate (audit P2-007). `python -m pytest tests/ -q --cov` in ci-python.yml measures branch coverage of every
# library module under this directory and fails below `fail_under`. Excluded: the tests themselves, and tools/ -- the
# experiment and calibration scripts, four of which (compare_plan04*, generate_strategy_spec_fixture) no test imports at
# all. Measured on 2026-11-25: 93% with tools/ left out (5116 statements, 1498 branches), 87% with it in, so a threshold of
# 90 is 3 points under the library figure. `source = ["."]` is deliberate: it counts a library module that no test imports
# as 0% instead of leaving it out, which would hide exactly the gap this gate is for. Raise `fail_under` when the number
# rises; do not lower it to make a red run green.
[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "tools/*", ".venv/*", "*.egg-info/*"]

[tool.coverage.report]
fail_under = 90
show_missing = false
skip_covered = true

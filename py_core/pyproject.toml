[project]
name = "py_core"
version = "0.1.0"
description = "HengYuan v2 — reusable research/backtest utilities (no live execution, no risk gate, no exchange adapter)."
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.8,<3.0",
  "pandas>=2.2,<3.0",
  "numpy>=2.1,<3.0",
  "pyarrow>=25.0,<26.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10.0",
]

[tool.setuptools]
# core/, risk/, backtests/ live directly under this pyproject.toml's directory
# (no src/ layout), so setuptools' automatic package discovery sees them as
# separate top-level packages and refuses to build. Map "py_core" explicitly
# onto "." so `import py_core.manual_ohlcv` etc. resolves as intended.
package-dir = {"py_core" = "."}
packages = ["py_core", "py_core.backtests", "py_core.core", "py_core.risk", "py_core.market_data", "py_core.validation", "py_core.indicators", "py_core.strategies", "py_core.strategy_spec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

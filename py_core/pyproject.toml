[project]
name = "py_core"
version = "0.1.0"
description = "HengYuan v2 — reusable research/backtest utilities (no live execution, no risk gate, no exchange adapter)."
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.8,<3.0",
  "pandas>=2.2,<3.0",
  "numpy>=2.1,<3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
